<title>Estudio CTAL-TM v3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: barra superior fija + índice lateral por capítulos + columna de lectura.
   Repaso rápido y Práctica son vistas propias. Colores de estado tomados del vocabulario
   de un test report: passed (verde), failed (rojo), blocked (ámbar). */
:root {
  --bg: #f2f5f5;
  --surface: #ffffff;
  --surface-2: #e8eeee;
  --ink: #132227;
  --muted: #56696e;
  --line: #d3dedf;
  --line-strong: #a9bbbe;
  --accent: #0c6770;
  --accent-ink: #ffffff;
  --accent-soft: #dcefef;
  --accent-line: #9ccfd2;
  --pass: #1b7a43;
  --pass-soft: #def2e6;
  --fail: #b3372f;
  --fail-soft: #f8e2df;
  --blocked: #98600c;
  --blocked-soft: #faedd5;
  --shadow: 0 1px 2px rgba(19, 34, 39, .06), 0 8px 24px rgba(19, 34, 39, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, "Courier New", monospace;
  --top-h: 60px;
  --side-w: 290px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1618; --surface: #142024; --surface-2: #1a292d; --ink: #e1ebeb; --muted: #93a8ac;
    --line: #25363a; --line-strong: #3d5459; --accent: #52bcc5; --accent-ink: #062024;
    --accent-soft: #143539; --accent-line: #2b6a70; --pass: #5bc68a; --pass-soft: #15301f;
    --fail: #f07d73; --fail-soft: #3a1d1a; --blocked: #e4ab50; --blocked-soft: #33270f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1618; --surface: #142024; --surface-2: #1a292d; --ink: #e1ebeb; --muted: #93a8ac;
  --line: #25363a; --line-strong: #3d5459; --accent: #52bcc5; --accent-ink: #062024;
  --accent-soft: #143539; --accent-line: #2b6a70; --pass: #5bc68a; --pass-soft: #15301f;
  --fail: #f07d73; --fail-soft: #3a1d1a; --blocked: #e4ab50; --blocked-soft: #33270f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(var(--top-h) + 16px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
p { margin: 0; }
code { font-family: var(--f-mono); font-size: .92em; background: var(--surface-2); padding: 1px 6px; border-radius: 5px; }
strong { font-weight: 600; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
.muted { color: var(--muted); }

/* ---------- Barra superior ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  height: var(--top-h); display: flex; align-items: center; gap: 14px;
  padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.menu-btn { display: none; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); display: inline-grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn:hover { border-color: var(--line-strong); }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); flex: none; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
.brand span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.search { position: relative; flex: 1; max-width: 520px; margin-inline: auto; min-width: 0; }
.search input {
  width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 0 12px 0 38px; font: inherit; font-size: 15px;
}
.search input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.search > svg { position: absolute; left: 12px; top: 11px; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }
.search kbd { position: absolute; right: 10px; top: 10px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.results {
  position: absolute; top: 46px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); max-height: min(70vh, 520px); overflow: auto; padding: 6px;
}
.res { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 10px 12px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.res:hover, .res.on { background: var(--accent-soft); }
.res .rnum { font-family: var(--f-mono); font-size: 12px; color: var(--accent); padding-top: 2px; }
.res .rtitle { font-weight: 600; }
.res .rsnip { grid-column: 2; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.res mark, .flash-hit { background: var(--blocked-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.res-empty { padding: 14px; color: var(--muted); font-size: 14px; }
.top-prog { display: flex; align-items: center; gap: 10px; flex: none; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.top-prog .track { width: 90px; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.top-prog .track i { display: block; height: 100%; width: var(--w, 0%); background: var(--pass); transition: width .3s; }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); }
.sidebar {
  position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px));
  height: calc(100vh - var(--top-h)); overflow-y: auto; border-right: 1px solid var(--line);
  background: var(--surface); padding: 16px 12px 40px;
}
.modes { display: grid; gap: 4px; padding-bottom: 14px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.mode {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px;
  text-decoration: none; color: var(--ink); font-weight: 500;
}
.mode svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mode small { margin-left: auto; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.mode:hover { background: var(--surface-2); }
.mode.on { background: var(--accent); color: var(--accent-ink); }
.mode.on small { color: inherit; opacity: .8; }
.toc-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 12px 8px; }
.toc-g {
  display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: start; padding: 8px 10px;
  border-radius: 9px; text-decoration: none; color: var(--ink); font-size: 14.5px; line-height: 1.35;
}
.toc-g:hover { background: var(--surface-2); }
.toc-g.on { background: var(--accent-soft); font-weight: 600; }
.toc-g .gnum { font-family: var(--f-mono); font-size: 12px; color: var(--accent); padding-top: 2px; }
.toc-g .gcount { font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding-top: 2px; }
.toc-g .gcount.full { color: var(--pass); }
.toc-secs { list-style: none; margin: 2px 0 8px; padding: 0 0 0 26px; }
.toc-secs a {
  display: flex; gap: 8px; padding: 5px 10px; border-radius: 7px; text-decoration: none;
  color: var(--muted); font-size: 13.5px; line-height: 1.35;
}
.toc-secs a:hover { color: var(--ink); background: var(--surface-2); }
.toc-secs a.cur { color: var(--ink); background: var(--surface-2); }
.toc-secs a .n { font-family: var(--f-mono); font-size: 11.5px; min-width: 34px; padding-top: 1px; }
.toc-secs a.d3 { padding-left: 22px; }
.toc-secs a.done .n { color: var(--pass); }
.toc-secs a.done::after { content: "✓"; margin-left: auto; color: var(--pass); font-size: 12px; }
.scrim { display: none; }

main { min-width: 0; padding: 32px clamp(16px, 4vw, 56px) 96px; }
.view { max-width: 900px; margin: 0 auto; }

/* ---------- Estudio ---------- */
.hero { padding-block: 8px 28px; display: grid; gap: 14px; }
.hero h1 { font-size: clamp(2rem, 5.5vw, 3.3rem); font-weight: 800; letter-spacing: -.02em; }
.hero .sub { font-size: 1.1rem; color: var(--muted); }
.source-note { border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; background: var(--surface); font-size: 14.5px; color: var(--muted); display: grid; gap: 4px; }

.dash { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 8px 0 28px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; align-content: start; }
.tile .k { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tile .v { font-family: var(--f-display); font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.tile .v small { font-size: .9rem; color: var(--muted); font-weight: 600; font-family: var(--f-body); }
.tile .track { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.tile .track i { display: block; height: 100%; width: var(--w, 0%); background: var(--c, var(--accent)); }
.tile a { font-size: 14px; font-weight: 600; text-decoration: none; }
.tile a:hover { text-decoration: underline; }
.chap-bars { display: grid; gap: 6px; font-size: 13px; }
.chap-bars div { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; font-family: var(--f-mono); color: var(--muted); }
.chap-bars .track { height: 6px; }

.group-head { display: grid; gap: 10px; padding-bottom: 20px; }
.group-head h1 { font-size: clamp(1.8rem, 4.5vw, 2.6rem); font-weight: 800; letter-spacing: -.015em; }
.group-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; color: var(--muted); }
.group-meta .track { width: 140px; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.group-meta .track i { display: block; height: 100%; width: var(--w, 0%); background: var(--pass); }

.sec { padding-block: 30px; border-top: 1px solid var(--line); scroll-margin-top: calc(var(--top-h) + 12px); }
.sec.depth-2 { border-top: 2px solid var(--ink); margin-top: 18px; }
.sec.lead { border-top: 0; padding-top: 0; }
.sec-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
.sec-head .num { font-family: var(--f-mono); font-size: 13px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 3px 8px; margin-top: 3px; flex: none; font-weight: 600; }
.sec-head h2 { font-size: 1.45rem; font-weight: 700; flex: 1; min-width: 0; }
.sec.depth-2 .sec-head h2 { font-size: 1.8rem; font-weight: 800; }
.sec.lead .sec-head { justify-content: flex-end; }
.done-btn {
  flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
  background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--muted);
}
.done-btn:hover { border-color: var(--pass); color: var(--pass); }
.done-btn[aria-pressed="true"] { background: var(--pass-soft); border-color: var(--pass); color: var(--pass); font-weight: 600; }
.done-btn .box { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid currentColor; display: inline-grid; place-items: center; font-size: 10px; line-height: 1; }
.sec.flash-on { animation: flashsec 1.6s ease-out; }
@keyframes flashsec { 0% { background: var(--accent-soft); } 100% { background: transparent; } }

.sec-body { display: grid; gap: 14px; }
.sec-body > p, .sub > p, .concept > p, .mini > p { max-width: 68ch; }
.sec-body h3 { font-size: 1.12rem; font-weight: 700; }
.sec-body h4 { font-size: 1rem; font-weight: 700; font-family: var(--f-body); }
.sub { display: grid; gap: 12px; margin-top: 8px; }
.sub-exam { background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 12px; padding: 16px 20px; }
.sub-example { background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 12px; padding: 16px 20px; }
.tag { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--accent); display: inline-flex; align-items: center; gap: 6px; margin-bottom: -4px; }
.sub-example .tag { color: var(--blocked); }
.sub-example .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sub-exam .tag::before { content: "!"; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-grid; place-items: center; font-size: 11px; }
.statement { font-family: var(--f-display); font-size: 1.12rem; font-weight: 600; }
.statement strong { font-weight: 700; }

.card-grid, .mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.concept, .mini { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.sub-example .concept { background: var(--surface); }
.concept h4, .mini h3 { font-family: var(--f-display); font-size: 1.02rem; font-weight: 700; }

ul.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
ul.chips li { padding: 3px 11px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); font-size: 14px; line-height: 1.5; }
.sub-exam ul.chips li, .sub-example ul.chips li { background: var(--surface); }
ul.chips.prio-high li { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
ul.chips.prio li { border-color: var(--accent-line); }
ul.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; max-width: 70ch; }
ul.list li { position: relative; padding-left: 18px; }
ul.list li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 6px; height: 6px; border-radius: 2px; background: var(--accent); }
.arr { color: var(--accent); font-weight: 600; }
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: st; max-width: 70ch; }
ol.steps li { counter-increment: st; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: baseline; }
ol.steps li::before { content: counter(st); font-family: var(--f-mono); font-size: 12px; font-weight: 600; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: inline-grid; place-items: center; }

ol.flow { list-style: none; margin: 4px 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
ol.flow li { display: flex; align-items: center; gap: 10px; }
ol.flow li span { padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--surface); font-weight: 600; font-size: 15px; }
ol.flow li:not(:last-child)::after { content: "→"; color: var(--accent); font-weight: 700; font-size: 18px; }
.formula { font-family: var(--f-mono); font-size: 1.15rem; padding: 14px 18px; border: 1.5px dashed var(--accent-line); border-radius: 10px; background: var(--surface); justify-self: start; }

blockquote.q { margin: 0; padding: 12px 16px; border-left: 3px solid var(--line-strong); background: var(--surface); border-radius: 0 10px 10px 0; font-style: italic; display: grid; gap: 4px; }
blockquote.q.bad { border-left-color: var(--fail); background: var(--fail-soft); }
blockquote.q.good { border-left-color: var(--pass); background: var(--pass-soft); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
th.r, td.r { text-align: right; }
table.versus th:first-child, table.versus td:first-child { border-right: 1px solid var(--line); }
table.versus th { font-family: var(--f-display); font-size: 15px; }
table.versus th:first-child { color: var(--accent); }
table.versus th:last-child { color: var(--blocked); }
.yn { display: inline-block; font-family: var(--f-mono); font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; }
.yn.yes { background: var(--pass-soft); color: var(--pass); }
.yn.no { background: var(--surface-2); color: var(--muted); }
.bar-cell { display: grid; grid-template-columns: minmax(60px, 1fr) auto; gap: 10px; align-items: center; min-width: 170px; }
.bar-cell .bar { height: 8px; border-radius: 99px; background: var(--surface-2); position: relative; overflow: hidden; }
.bar-cell .bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--accent); border-radius: 99px; }
.bar-cell .num { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }

.quad { display: grid; grid-template-columns: 26px 1fr 1fr; grid-template-rows: 1fr 1fr 26px; gap: 8px; max-width: 520px; }
.quad .cell { border-radius: 12px; padding: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; gap: 2px; min-height: 92px; align-content: center; }
.quad .cell b { font-family: var(--f-display); font-size: 1.05rem; }
.quad .cell span { font-size: 12.5px; color: var(--muted); font-family: var(--f-mono); }
.quad .cell.hot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.quad .cell.hot span { color: inherit; opacity: .85; }
.quad .ax { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: grid; place-items: center; letter-spacing: .06em; text-transform: uppercase; }
.quad .ax.y { writing-mode: vertical-rl; transform: rotate(180deg); grid-row: 1 / 3; }
.quad .ax.x { grid-column: 2 / 4; }

ul.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
ul.checklist label { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; align-items: start; }
ul.checklist label:hover { background: var(--surface-2); }
ul.checklist input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--pass); }
ul.checklist input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
.pager a { display: grid; gap: 2px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; color: var(--ink); min-width: 0; flex: 1 1 240px; }
.pager a:hover { border-color: var(--accent); }
.pager a small { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pager a.next { text-align: right; }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 15px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--line-strong); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 0 10px; }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.good { color: var(--pass); border-color: var(--pass); }
.btn.good:hover { background: var(--pass-soft); }
.btn.warn { color: var(--blocked); border-color: var(--blocked); }
.btn.warn:hover { background: var(--blocked-soft); }

/* ---------- Repaso rápido ---------- */
.view-head { display: grid; gap: 10px; padding-bottom: 22px; }
.view-head h1 { font-size: clamp(1.8rem, 4.5vw, 2.6rem); font-weight: 800; letter-spacing: -.015em; }
.view-head p { color: var(--muted); max-width: 62ch; }
.flash-stage { perspective: 1400px; }
.flash {
  width: 100%; min-height: 280px; border: 0; padding: 0; background: none; cursor: pointer; display: block;
  position: relative; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2, .7, .2, 1);
}
.flash.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; border-radius: 18px; padding: 28px clamp(20px, 5vw, 44px);
  display: grid; align-content: center; gap: 12px; text-align: left; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow);
}
.face .k { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.face .term { font-family: var(--f-display); font-size: clamp(1.7rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: -.015em; line-height: 1.1; }
.face .hint { font-size: 13px; color: var(--muted); }
.face.back { transform: rotateY(180deg); background: var(--accent-soft); border-color: var(--accent-line); }
.face.back .def { font-size: clamp(1.2rem, 3.2vw, 1.6rem); font-family: var(--f-display); font-weight: 600; line-height: 1.3; }
.face .status { position: absolute; top: 18px; right: 20px; font-family: var(--f-mono); font-size: 11px; padding: 3px 9px; border-radius: 99px; }
.face .status.known { background: var(--pass-soft); color: var(--pass); }
.face .status.again { background: var(--blocked-soft); color: var(--blocked); }
.flash-ctrl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 16px; }
.flash-ctrl .grp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.flash-count { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
.term-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); }
.term-strip button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 11px; font-size: 13.5px; cursor: pointer; }
.term-strip button.known { border-color: var(--pass); color: var(--pass); background: var(--pass-soft); }
.term-strip button.again { border-color: var(--blocked); color: var(--blocked); background: var(--blocked-soft); }
.term-strip button.cur { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- Práctica ---------- */
.dist { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; }
.dist .tile .rows { display: grid; gap: 6px; font-size: 13px; }
.dist .tile .rows div { display: grid; grid-template-columns: 96px 1fr 26px; gap: 8px; align-items: center; font-family: var(--f-mono); color: var(--muted); }
.dist .tile .rows .track { height: 6px; }
.qform { display: grid; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px clamp(16px, 3vw, 26px); }
.qform fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.qform legend { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0; margin-bottom: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { position: relative; }
.pill input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.pill span { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; }
.pill span small { font-family: var(--f-mono); color: var(--muted); font-size: 11.5px; }
.pill input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pill input:checked + span small { color: inherit; opacity: .8; }
.pill input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.mode-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mode-card { position: relative; }
.mode-card input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.mode-card span { display: grid; gap: 4px; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); height: 100%; }
.mode-card b { font-family: var(--f-display); font-size: 1.05rem; }
.mode-card small { color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.mode-card input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
.mode-card input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.qform .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding-top: 4px; }
.history { margin-top: 26px; display: grid; gap: 8px; }
.history h2 { font-size: 1.1rem; }
.hist-row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 14px; }
.hist-row .pct { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }

.q-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.q-count { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.q-bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-bottom: 18px; }
.q-bar i { display: block; height: 100%; width: var(--w, 0%); background: var(--accent); transition: width .3s; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: clamp(18px, 3.5vw, 30px); display: grid; gap: 18px; box-shadow: var(--shadow); }
.q-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-weight: 500; }
.chip.k { font-family: var(--f-mono); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chip.d-medium { font-family: var(--f-mono); }
.chip.d-medium-high { font-family: var(--f-mono); background: var(--blocked-soft); color: var(--blocked); }

.q-meta .qid { margin-left: auto; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.q-text { display: grid; gap: 10px; font-size: 1.08rem; line-height: 1.55; }

.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; text-align: left;
  padding: 13px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1.5;
}
.opt:hover:not(:disabled) { border-color: var(--accent-line); background: var(--bg); }

.opt.wrong { border-color: var(--fail); background: var(--fail-soft); }

.feedback { border-radius: 12px; padding: 16px 18px; display: grid; gap: 8px; border: 1px solid var(--line); background: var(--bg); }

.q-nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-top: 16px; }

.confirm { margin-top: 14px; padding: 14px 16px; border: 1px solid var(--blocked); background: var(--blocked-soft); border-radius: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.kbd-hint { font-size: 12.5px; color: var(--muted); margin-top: 14px; }
.kbd-hint kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--surface); }

.score-head { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px clamp(18px, 3vw, 28px); }
.ring { width: 128px; height: 128px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--surface-2) 0); }
.ring div { width: 100px; height: 100px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.9rem; font-variant-numeric: tabular-nums; }
.score-head h1 { font-size: 1.7rem; font-weight: 800; }
.score-head p { color: var(--muted); }
.breakdown { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 16px 0 26px; }
.breakdown .rows div { grid-template-columns: 88px 1fr 44px; }
.review-filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.review-filter h2 { font-size: 1.2rem; margin-right: auto; }
.rev { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 8px; }
.rev summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; }
.rev summary::-webkit-details-marker { display: none; }
.rev .mk { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.rev .mk.ok { background: var(--pass-soft); color: var(--pass); }
.rev .mk.ko { background: var(--fail-soft); color: var(--fail); }
.rev .mk.na { background: var(--surface-2); color: var(--muted); }
.rev .st { font-size: 14px; min-width: 0; }
.rev .st small { display: block; color: var(--muted); font-size: 12.5px; }
.rev .ans { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.rev .body { padding: 0 16px 16px; display: grid; gap: 12px; }
.rev .opt { cursor: default; }
.results-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 26px; }

/* ---------- Responsive ---------- */
@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }

    position: fixed; z-index: 50; top: 0; left: 0; bottom: 0; height: auto; width: min(88vw, 330px);

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  // ---------- Persistencia local (solo comodidad; la página funciona sin ella) ----------
  const store = (() => {
    const KEY = 'ctaltm-estudio-v1';
    let data = {};
    try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { data = {}; }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* sin almacenamiento */ } };
    return {
      get: (k, d) => (Object.prototype.hasOwnProperty.call(data, k) ? data[k] : d),
      set: (k, v) => { data[k] = v; save(); },
    };
  })();

  // ---------- Tema ----------
  const root = document.documentElement;
  const applyTheme = (t) => { if (t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); drawThemeIcon(); };
  const isDark = () => {
    const t = root.getAttribute('data-theme');
    if (t) return t === 'dark';
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  };
  function drawThemeIcon() {
    const icon = $('#theme-icon');
    if (!icon) return;
    icon.innerHTML = isDark()
      ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
      : '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>';
    $('#theme-btn').setAttribute('aria-label', isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
  }
  applyTheme(store.get('theme', null));
  $('#theme-btn').addEventListener('click', () => { const next = isDark() ? 'light' : 'dark'; applyTheme(next); store.set('theme', next); });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawThemeIcon); } catch (e) {} }

  // ---------- Utilidades de texto ----------
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const plain = (s) => s.replace(/\*\*/g, '').replace(/`/g, '').replace(/^[#>|\-\s]+/gm, ' ').replace(/\|/g, ' ');
  const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  // ---------- Parser del resumen (contenido literal del MD) ----------
  function parseTable(rows) {
    const cells = (r) => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
    const head = cells(rows[0]);
    const align = cells(rows[1]).map((c) => (/:$/.test(c) ? 'right' : 'left'));
    return { t: 'table', head, align, rows: rows.slice(2).map(cells) };
  }
  function parseBlocks(lines) {
    const out = [];
    const special = (l) => /^(#{2,6} |\||>|- |\d+\. )/.test(l) || /^---\s*$/.test(l);
    let i = 0;
    while (i < lines.length) {
      const l = lines[i];
      let m;
      if (!l.trim() || /^---\s*$/.test(l)) { i++; continue; }
      if ((m = l.match(/^(#{2,6}) (.+)$/))) { out.push({ t: 'h', level: m[1].length, text: m[2].trim() }); i++; continue; }
      if (l.startsWith('|')) { const r = []; while (i < lines.length && lines[i].startsWith('|')) r.push(lines[i++]); out.push(parseTable(r)); continue; }
      if (l.startsWith('>')) { const q = []; while (i < lines.length && lines[i].startsWith('>')) q.push(lines[i++].replace(/^> ?/, '').trim()); out.push({ t: 'quote', lines: q.filter(Boolean) }); continue; }
      if (/^- /.test(l)) { const it = []; while (i < lines.length && /^- /.test(lines[i])) it.push(lines[i++].slice(2).trim()); out.push({ t: 'ul', items: it }); continue; }
      if (/^\d+\. /.test(l)) { const it = []; while (i < lines.length && /^\d+\. /.test(lines[i])) it.push(lines[i++].replace(/^\d+\. /, '').trim()); out.push({ t: 'ol', items: it }); continue; }
      const p = [];
      while (i < lines.length && lines[i].trim() && !special(lines[i])) p.push(lines[i++].trim());
      out.push({ t: 'p', text: p.join(' ') });
    }
    return out;
  }

  const md = $('#summary-md').textContent;
  const sections = [];
  {
    let cur = null;
    for (const line of md.split('\n')) {
      const m = line.match(/^# (.+)$/);
      if (m) { cur = { title: m[1].trim(), lines: [] }; sections.push(cur); } else if (cur) cur.lines.push(line.replace(/\s+$/, ''));
    }
  }
  sections.forEach((s) => {
    const m = s.title.match(/^(\d+(?:\.\d+)*)\.?\s+(.+)$/);
    s.num = m ? m[1] : null;
    s.name = m ? m[2] : s.title;
    s.group = s.num ? s.num.split('.')[0] : '0';
    s.depth = s.num ? s.num.split('.').length : 0;
    s.id = s.num ? 'sec-' + s.num.replace(/\./g, '-') : 'sec-intro';
    s.blocks = parseBlocks(s.lines);
    s.text = plain(s.lines.join('\n')).replace(/\s+/g, ' ').trim();
  });
  const byId = Object.fromEntries(sections.map((s) => [s.id, s]));
  const groups = [...new Set(sections.map((s) => s.group))];
  const leadOf = (g) => sections.find((s) => s.num === g);
  const groupSecs = (g) => sections.filter((s) => s.group === g);
  const trackable = sections.filter((s) => s.num);

  // Tiempo de formación por capítulo, tomado de la tabla de "0. Visión general"
  const chapterTime = {};
  (leadOf('0') ? leadOf('0').blocks : []).forEach((b) => {
    if (b.t === 'table' && /Cap/i.test(b.head[0])) b.rows.forEach((r) => { chapterTime[r[0]] = r[2]; });
  });
  const groupEyebrow = (g) => (g === '0' ? 'Inicio' : ['1', '2', '3'].includes(g) ? `Capítulo ${g}${chapterTime[g] ? ' · ' + chapterTime[g] : ''}` : `Sección ${g}`);

  // ---------- Render de bloques ----------
  const EXAM = /^(Idea central|Idea clave|Idea importante|Idea|Importante|Diferencia clave|Principio|Regla conceptual del syllabus|Resumen)$/i;
  function kindOf(title, group) {
    if (group === '8') return /^Muy/i.test(title) ? 'prio-high' : 'prio';
    if (group === '9') return 'lo';
    if (/^Ejemplo/i.test(title)) return 'example';
    if (EXAM.test(title)) return 'exam';
    return 'default';
  }
  let loCounter = 0;
  function renderList(items, kind) {
    if (kind === 'lo') {
      return '<ul class="checklist">' + items.map((it) => {
        const id = 'lo-' + (loCounter++);
        return `<li><label for="${id}"><input type="checkbox" id="${id}" data-lo="${id}"><span>${inline(it)}</span></label></li>`;
      }).join('') + '</ul>';
    }
    const short = items.length >= 3 && items.every((it) => plain(it).length <= 34 && !it.includes('→'));
    if (short) return `<ul class="chips${kind && kind.startsWith('prio') ? ' ' + kind : ''}">${items.map((i) => `<li>${inline(i)}</li>`).join('')}</ul>`;
    return `<ul class="list">${items.map((i) => `<li>${inline(i).replace(/ → /g, ' <span class="arr">→</span> ')}</li>`).join('')}</ul>`;
  }
  function renderFlow(text) {
    return '<ol class="flow">' + text.split('→').map((p) => `<li><span>${inline(p.trim())}</span></li>`).join('') + '</ol>';
  }
  function quadrant(b) {
    const hi = (v) => norm(v) === 'alta';
    const find = (inf, int) => b.rows.find((r) => hi(r[1]) === inf && hi(r[2]) === int);
    const cell = (r, hot) => r ? `<div class="cell${hot ? ' hot' : ''}"><b>${esc(r[0])}</b><span>Influencia ${esc(r[1].toLowerCase())} · Interés ${esc(r[2].toLowerCase())}</span></div>` : '<div class="cell"></div>';
    return `<div class="quad" aria-label="Matriz de stakeholders: influencia frente a interés">
      <div class="ax y">Influencia ↑</div>
      ${cell(find(true, false))}${cell(find(true, true), true)}
      ${cell(find(false, false))}${cell(find(false, true))}
      <div></div><div class="ax x">Interés →</div></div>`;
  }
  function renderTable(b) {
    const isNum = b.align.map((a, ci) => a === 'right' && b.rows.every((r) => /^\d/.test(r[ci] || '')));
    const max = isNum.map((n, ci) => (n ? Math.max(...b.rows.map((r) => parseFloat(r[ci]))) : 0));
    const cell = (c, ci) => {
      if (c === 'Sí') return '<span class="yn yes">Sí</span>';
      if (c === 'No') return '<span class="yn no">No</span>';
      if (isNum[ci]) { const v = parseFloat(c); return `<div class="bar-cell"><span class="bar" style="--w:${(v / max[ci] * 100).toFixed(1)}%"></span><span class="num">${esc(c)}</span></div>`; }
      return inline(c);
    };
    const cls = b.head.length === 2 ? ' class="versus"' : '';
    let html = `<div class="table-wrap"><table${cls}><thead><tr>${b.head.map((h, ci) => `<th${b.align[ci] === 'right' && !isNum[ci] ? ' class="r"' : ''}>${inline(h)}</th>`).join('')}</tr></thead><tbody>`;
    html += b.rows.map((r) => `<tr>${r.map((c, ci) => `<td>${cell(c, ci)}</td>`).join('')}</tr>`).join('');
    html += '</tbody></table></div>';
    if (b.head[0] === 'Tipo' && b.head.includes('Influencia')) html += quadrant(b);
    return html;
  }
  function renderBlocks(bs, kind) {
    let out = '';
    bs.forEach((b, idx) => {
      const prev = bs[idx - 1];
      if (b.t === 'p') {
        const t = b.text;
        if (/^\*\*[^*]*→[^*]*\*\*$/.test(t)) out += renderFlow(t.slice(2, -2));
        else if (/^`[^`]+`$/.test(t)) out += `<div class="formula">${esc(t.slice(1, -1))}</div>`;
        else if (/^\*\*[^*]+\*\*$/.test(t)) out += `<p class="statement">${inline(t)}</p>`;
        else out += `<p>${inline(t)}</p>`;
      } else if (b.t === 'quote') {
        let cls = '';
        if (prev && prev.t === 'p') {
          const pt = norm(prev.text);
          if (pt.includes('poco util')) cls = ' bad';
          else if (pt.includes('mas util') || pt.includes('medible')) cls = ' good';
        }
        out += `<blockquote class="q${cls}">${b.lines.map((l) => `<p>${inline(l)}</p>`).join('')}</blockquote>`;
      } else if (b.t === 'ul') out += renderList(b.items, kind);
      else if (b.t === 'ol') out += `<ol class="steps">${b.items.map((i) => `<li><span>${inline(i)}</span></li>`).join('')}</ol>`;
      else if (b.t === 'table') out += renderTable(b);
      else if (b.t === 'h') out += `<h4>${inline(b.text)}</h4>`;
    });
    return out;
  }
  function splitBy(blocks, test) {
    const pre = []; const parts = []; let cur = null;
    for (const b of blocks) {
      if (test(b)) { cur = { title: b.text, blocks: [] }; parts.push(cur); } else (cur ? cur.blocks : pre).push(b);
    }
    return { pre, parts };
  }
  const TAGS = { exam: 'Clave de examen', example: 'Ejemplo', 'prio-high': 'Prioridad máxima', prio: 'Prioridad' };
  function renderSub(x, s) {
    const kind = kindOf(x.title, s.group);
    const { pre, parts } = splitBy(x.blocks, (b) => b.t === 'h' && b.level >= 3);
    let inner = renderBlocks(pre, kind);
    if (parts.length) inner += '<div class="card-grid">' + parts.map((c) => `<div class="concept"><h4>${inline(c.title)}</h4>${renderBlocks(c.blocks, kind)}</div>`).join('') + '</div>';
    const tag = TAGS[kind];
    const showTitle = !(kind === 'example' && /^Ejemplo$/i.test(x.title));
    return `<section class="sub sub-${kind}">${tag ? `<span class="tag">${tag}</span>` : ''}${showTitle ? `<h3>${inline(x.title)}</h3>` : ''}${inner}</section>`;
  }
  function renderSectionBody(s) {
    const { pre, parts } = splitBy(s.blocks, (b) => b.t === 'h' && b.level === 2);
    let html = renderBlocks(pre, 'default');
    const compact = parts.length >= 3 && parts.every((x) => kindOf(x.title, s.group) === 'default' && x.blocks.length <= 3 && !x.blocks.some((b) => b.t === 'table' || b.t === 'h'));
    if (compact) html += '<div class="mini-grid">' + parts.map((x) => `<div class="mini"><h3>${inline(x.title)}</h3>${renderBlocks(x.blocks, 'default')}</div>`).join('') + '</div>';
    else html += parts.map((x) => renderSub(x, s)).join('');
    return html;
  }

  // ---------- Progreso de estudio ----------
  const studied = () => store.get('studied', {});
  const isDone = (id) => !!studied()[id];
  function setDone(id, v) { const st = { ...studied() }; if (v) st[id] = true; else delete st[id]; store.set('studied', st); refreshProgress(); }
  const groupProgress = (g) => { const list = groupSecs(g).filter((s) => s.num); return [list.filter((s) => isDone(s.id)).length, list.length]; };

  // ---------- Vista de estudio ----------
  const viewStudy = $('#view-study');
  const groupEls = {};
  function doneBtn(s) {
    const on = isDone(s.id);
    return `<button class="done-btn" data-done="${s.id}" aria-pressed="${on}"><span class="box">${on ? '✓' : ''}</span>${on ? 'Estudiado' : 'Marcar estudiado'}</button>`;
  }
  function renderGroup(g) {
    const lead = leadOf(g);
    const idx = groups.indexOf(g);
    let html = '';
    if (g === '0') {
      const intro = byId['sec-intro'];
      if (intro) {
        const [main, sub] = intro.title.split(' — ');
        const q = intro.blocks.find((b) => b.t === 'quote');
        html += `<header class="hero"><p class="eyebrow">${esc(groupEyebrow(g))}</p><h1>${inline(main)}</h1>${sub ? `<p class="sub">${inline(sub)}</p>` : ''}
          ${q ? `<div class="source-note">${q.lines.map((l) => `<p>${inline(l)}</p>`).join('')}</div>` : ''}</header>`;
      }
      html += '<div class="dash" id="dash"></div>';
    } else {
      html += `<header class="group-head"><p class="eyebrow">${esc(groupEyebrow(g))}</p><h1>${inline(lead ? lead.name : '')}</h1>
        <div class="group-meta"><span class="track"><i data-gbar="${g}"></i></span><span data-gtext="${g}"></span></div></header>`;
    }
    for (const s of groupSecs(g)) {
      if (!s.num) continue;
      const isLead = s === lead;
      html += `<article class="sec depth-${s.depth}${isLead ? ' lead' : ''}" id="${s.id}">
        <div class="sec-head">${isLead ? '' : `<span class="num">${esc(s.num)}</span><h2>${inline(s.name)}</h2>`}${doneBtn(s)}</div>
        <div class="sec-body">${renderSectionBody(s)}${s.group === '7' && isLead ? '<p><a class="btn primary" href="#repaso">Practicar estos conceptos como tarjetas</a></p>' : ''}</div></article>`;
    }
    const prev = groups[idx - 1]; const next = groups[idx + 1];
    const label = (x) => (leadOf(x) ? leadOf(x).name : 'Inicio');
    html += `<nav class="pager">${prev ? `<a href="#g-${prev}"><small>← ${esc(groupEyebrow(prev))}</small>${inline(label(prev))}</a>` : '<span></span>'}
      ${next ? `<a class="next" href="#g-${next}"><small>${esc(groupEyebrow(next))} →</small>${inline(label(next))}</a>` : ''}</nav>`;
    const el = document.createElement('div');
    el.className = 'group';
    el.dataset.group = g;
    el.hidden = true;
    el.innerHTML = html;
    viewStudy.appendChild(el);
    groupEls[g] = el;
  }
  groups.forEach(renderGroup);

  // Objetivos de aprendizaje: estado de las casillas
  const loState = store.get('los', {});
  $$('[data-lo]').forEach((cb) => { cb.checked = !!loState[cb.dataset.lo]; });
  viewStudy.addEventListener('change', (e) => {
    const cb = e.target.closest('[data-lo]');
    if (!cb) return;
    const st = { ...store.get('los', {}) };
    if (cb.checked) st[cb.dataset.lo] = true; else delete st[cb.dataset.lo];
    store.set('los', st);
  });
  viewStudy.addEventListener('click', (e) => {
    const b = e.target.closest('[data-done]');
    if (!b) return;
    const id = b.dataset.done;
    setDone(id, !isDone(id));
  });

  // ---------- Índice lateral ----------
  const toc = $('#toc');
  function renderToc(activeGroup) {
    toc.innerHTML = groups.map((g) => {
      const lead = leadOf(g);
      const [d, t] = groupProgress(g);
      const on = g === activeGroup;
      const secs = on ? `<ul class="toc-secs">${groupSecs(g).filter((s) => s.num && s !== lead).map((s) =>
        `<li><a href="#${s.id}" data-sec="${s.id}" class="d${Math.min(s.depth, 3)}${isDone(s.id) ? ' done' : ''}"><span class="n">${esc(s.num)}</span><span>${inline(s.name)}</span></a></li>`).join('')}</ul>` : '';
      return `<div class="toc-group"><a class="toc-g${on ? ' on' : ''}" href="#g-${g}"><span class="gnum">${g === '0' ? '0' : esc(g)}</span><span>${inline(lead ? lead.name : 'Visión general')}</span><span class="gcount${d === t ? ' full' : ''}">${d}/${t}</span></a>${secs}</div>`;
    }).join('');
  }

  // ---------- Panel de avance ----------
  const QDATA = JSON.parse($('#questions-json').textContent);
  const QS = QDATA.questions;
  const termSection = leadOf('7');
  const TERMS = [];
  if (termSection) {
    const { parts } = splitBy(termSection.blocks, (b) => b.t === 'h' && b.level === 2);
    parts.forEach((p) => { const def = p.blocks.find((b) => b.t === 'p'); if (def) TERMS.push({ term: p.title, def: def.text }); });
  }
  function renderDash() {
    const dash = $('#dash');
    if (!dash) return;
    const done = trackable.filter((s) => isDone(s.id)).length;
    const pct = Math.round(done / trackable.length * 100);
    const next = trackable.find((s) => !isDone(s.id));
    const hist = store.get('quizHistory', []);
    const last = hist[0];
    const cards = store.get('cards', {});
    const known = TERMS.filter((t) => cards[t.term] === 'known').length;
    const chap = ['1', '2', '3'].map((g) => { const [d, t] = groupProgress(g); return `<div><span>Cap. ${g}</span><span class="track"><i style="--w:${t ? d / t * 100 : 0}%;--c:var(--pass)"></i></span><span>${d}/${t}</span></div>`; }).join('');
    dash.innerHTML = `
      <div class="tile"><span class="k">Resumen estudiado</span><span class="v">${pct}% <small>${done}/${trackable.length} secciones</small></span>
        <div class="chap-bars">${chap}</div>
        ${next ? `<a href="#${next.id}">Continuar: ${esc(next.num)} ${inline(next.name)} →</a>` : '<span class="muted">Todas las secciones marcadas.</span>'}</div>
      <div class="tile"><span class="k">Práctica · 50 preguntas</span><span class="v">${last ? last.pct + '%' : '—'} <small>${last ? `último intento (${last.correct}/${last.total})` : 'sin intentos todavía'}</small></span>
        <span class="track"><i style="--w:${last ? last.pct : 0}%"></i></span>
        <a href="#practica">${last ? 'Nueva práctica →' : 'Empezar a practicar →'}</a></div>
      <div class="tile"><span class="k">Repaso rápido</span><span class="v">${known}/${TERMS.length} <small>conceptos dominados</small></span>
        <span class="track"><i style="--w:${TERMS.length ? known / TERMS.length * 100 : 0}%;--c:var(--pass)"></i></span>
        <a href="#repaso">Abrir tarjetas →</a></div>`;
  }

  function refreshProgress() {
    const done = trackable.filter((s) => isDone(s.id)).length;

    $('#top-pct').textContent = `${pct}% · ${done}/${trackable.length}`;
    $('#mode-study-count').textContent = `${done}/${trackable.length}`;
    $$('[data-done]').forEach((b) => {
      const on = isDone(b.dataset.done);

    });

      const [d, t] = groupProgress(g);
      const bar = $(`[data-gbar="${g}"]`); if (bar) bar.style.setProperty('--w', (t ? d / t * 100 : 0) + '%');
      const txt = $(`[data-gtext="${g}"]`); if (txt) txt.textContent = `${d} de ${t} secciones estudiadas`;

    renderToc(currentGroup);
    renderDash();
    const cards = store.get('cards', {});

  }

  // ---------- Navegación ----------
  let currentGroup = '0';
  let currentView = 'study';
  function showView(v) {
    currentView = v;
    $('#view-study').hidden = v !== 'study';
    $('#view-cards').hidden = v !== 'cards';
    $('#view-quiz').hidden = v !== 'quiz';
    $$('.mode').forEach((m) => m.classList.toggle('on', m.dataset.mode === v));
    if (v === 'cards') renderCards();
    if (v === 'quiz') renderQuiz();
  }
  function showGroup(g) {
    if (!groupEls[g]) g = '0';
    currentGroup = g;
    Object.entries(groupEls).forEach(([k, el]) => { el.hidden = k !== g; });
    renderToc(g);
    observeSections(g);
  }
  function route() {
    const h = decodeURIComponent(location.hash.slice(1)) || 'g-0';
    if (h === 'repaso') { showView('cards'); window.scrollTo(0, 0); }
    else if (h === 'practica') { showView('quiz'); window.scrollTo(0, 0); }
    else if (h.startsWith('sec-') && byId[h]) {
      const s = byId[h];
      showView('study'); showGroup(s.group);
      const el = document.getElementById(h);
      if (el) {
        requestAnimationFrame(() => {
          el.scrollIntoView({ block: 'start' });

        });
      } else window.scrollTo(0, 0);

    }
    closeSidebar();
  }
  window.addEventListener('hashchange', route);

  // Resaltar en el índice la sección visible
  let io = null;
  function observeSections(g) {
    if (io) io.disconnect();
    if (!('IntersectionObserver' in window)) return;
    io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) {
          $$('.toc-secs a').forEach((a) => a.classList.toggle('cur', a.dataset.sec === en.target.id));
        }
      });

  }

  // Menú móvil

  menuBtn.addEventListener('click', () => { const open = !sidebar.classList.contains('open'); sidebar.classList.toggle('open', open); scrim.hidden = !open; menuBtn.setAttribute('aria-expanded', String(open)); });
  scrim.addEventListener('click', closeSidebar);

  // ---------- Buscador ----------
  const searchInput = $('#search'); const results = $('#results');
  const index = trackable.map((s) => ({ s, n: norm(s.num + ' ' + s.name), t: norm(s.text) }));
  let resSel = 0; let resList = [];
  function highlight(raw, terms) {
    const n = norm(raw);
    if (n.length !== raw.length) return esc(raw);
    const marks = new Array(raw.length).fill(false);
    terms.forEach((t) => { let p = n.indexOf(t); while (p !== -1 && t) { for (let k = p; k < p + t.length; k++) marks[k] = true; p = n.indexOf(t, p + t.length); } });
    let out = ''; let open = false;
    for (let k = 0; k < raw.length; k++) {
      if (marks[k] && !open) { out += '<mark>'; open = true; }
      if (!marks[k] && open) { out += '</mark>'; open = false; }
      out += esc(raw[k]);
    }
    return out + (open ? '</mark>' : '');
  }
  function doSearch() {
    const q = norm(searchInput.value.trim());
    if (q.length < 2) { results.hidden = true; return; }
    const terms = q.split(/\s+/).filter(Boolean);
    resList = index.map((e) => {
      let score = 0;
      for (const t of terms) {
        const inName = e.n.includes(t);
        const count = e.t.split(t).length - 1;
        if (!inName && !count) return null;
        score += (inName ? 20 : 0) + Math.min(count, 6);
      }
      return { e, score };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 10);

    if (!resList.length) { results.innerHTML = `<div class="res-empty">Sin resultados para “${esc(searchInput.value.trim())}” en el resumen.</div>`; results.hidden = false; return; }
    results.innerHTML = resList.map(({ e }, i) => {
      const raw = e.s.text;
      const p = e.t.indexOf(terms[0]);
      const start = Math.max(0, p - 50);
      const snip = (start > 0 ? '…' : '') + raw.slice(start, start + 150) + (raw.length > start + 150 ? '…' : '');
      return `<a class="res${i === 0 ? ' on' : ''}" role="option" href="#${e.s.id}"><span class="rnum">${esc(e.s.num)}</span><span class="rtitle">${highlight(e.s.name, terms)}</span><span class="rsnip">${p >= 0 ? highlight(snip, terms) : ''}</span></a>`;
    }).join('');
    results.hidden = false;
  }
  searchInput.addEventListener('input', doSearch);
  searchInput.addEventListener('focus', doSearch);
  searchInput.addEventListener('keydown', (e) => {
    const items = $$('.res', results);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();

      items.forEach((it, i) => it.classList.toggle('on', i === resSel));

    } else if (e.key === 'Enter') {
      if (items[resSel]) { location.hash = items[resSel].getAttribute('href').slice(1); results.hidden = true; searchInput.blur(); }
    } else if (e.key === 'Escape') { results.hidden = true; searchInput.blur(); }
  });
  results.addEventListener('click', (e) => { if (e.target.closest('.res')) { results.hidden = true; } });
  document.addEventListener('click', (e) => { if (!e.target.closest('.search')) results.hidden = true; });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); searchInput.focus(); searchInput.select(); }
  });

  // ---------- Repaso rápido (tarjetas desde la sección 7) ----------
  const cardsState = { order: TERMS.map((_, i) => i), pos: 0, flipped: false, onlyPending: false };
  function cardPool() {
    const cards = store.get('cards', {});
    return cardsState.onlyPending ? cardsState.order.filter((i) => cards[TERMS[i].term] !== 'known') : cardsState.order;
  }
  function renderCards() {
    const view = $('#view-cards');
    const cards = store.get('cards', {});
    const pool = cardPool();
    if (cardsState.pos >= pool.length) cardsState.pos = 0;
    const known = TERMS.filter((t) => cards[t.term] === 'known').length;
    const i = pool[cardsState.pos];
    const t = TERMS[i];
    const status = t ? cards[t.term] : null;
    const statusHtml = status === 'known' ? '<span class="status known">Dominado</span>' : status === 'again' ? '<span class="status again">Repasar</span>' : '';
    view.innerHTML = `
      <header class="view-head"><p class="eyebrow">Sección 7 · Conceptos para repaso rápido</p><h1>Repaso rápido</h1>
        <p>${TERMS.length} conceptos del resumen. Lee el concepto, intenta definirlo y voltea la tarjeta para comprobarlo. Llevas ${known} de ${TERMS.length} dominados.</p></header>
      ${t ? `<div class="flash-stage"><button class="flash${cardsState.flipped ? ' flipped' : ''}" id="flash" aria-label="Voltear tarjeta">
        <div class="face front">${statusHtml}<span class="k">Concepto</span><span class="term">${inline(t.term)}</span><span class="hint">Pulsa la tarjeta o la barra espaciadora para ver la definición</span></div>
        <div class="face back">${statusHtml}<span class="k">${inline(t.term)}</span><span class="def">${inline(t.def)}</span></div>

      }
      if (e.key === 'ArrowLeft' && quiz.mode === 'exam') { e.preventDefault(); qAct('prev'); }
    } else if (currentView === 'cards') {
      if (e.key === ' ' && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); cardAct('flip'); }
      if (e.key === 'ArrowRight') cardAct('next');
      if (e.key === 'ArrowLeft') cardAct('prev');
    }
  });

  // ---------- Inicio ----------
  route();
  refreshProgress();
})();
</script>

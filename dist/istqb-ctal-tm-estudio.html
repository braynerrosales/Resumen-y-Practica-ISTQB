ividad forma parte de Test Completion?","options":{"A":"Eliminar los defectos aceptados para evitar que afecten las métricas.","B":"Reiniciar la ejecución de todos los casos para confirmar el cierre.","C":"Crear un nuevo plan de pruebas completo para la siguiente release.","D":"Comunicar los defectos conocidos, archivar el testware relevante y generar el reporte de cierre."},"correctAnswer":"D","explanation":"Test Completion incluye reporte final, archivo de testware, handover de información relevante y lessons learned."},{"id":4,"chapter":1,"topic":"Stakeholders","level":"K4","difficulty":"high","question":"En un proyecto, el Product Owner revisa diariamente resultados y decide prioridades. Un director de área controla el presupuesto, pero rara vez participa en el detalle operativo. ¿Cómo deberían clasificarse principalmente?","options":{"A":"Product Owner = Promoter; Director = Latent","B":"Product Owner = Defender; Director = Promoter","C":"Product Owner = Latent; Director = Apathetic","D":"Product Owner = Promoter; Director = Defender"},"correctAnswer":"A","explanation":"El Product Owner combina alto interés y alta influencia. El director tiene alta influencia pero bajo interés operativo, por lo que encaja como Latent."},{"id":5,"chapter":1,"topic":"Hybrid Software Development","level":"K4","difficulty":"high","question":"Un banco utiliza planificación secuencial para requisitos regulatorios, pero desarrollo y testing se realizan en sprints. El Test Manager detecta que las evidencias regulatorias se preparan solo al final, generando retrabajo. ¿Cuál es la mejor acción?","options":{"A":"Eliminar la documentación regulatoria porque el equipo trabaja en Agile.","B":"Tratar las obligaciones regulatorias como parte del enfoque híbrido e integrarlas desde las iteraciones.","C":"Mantener completamente separados ambos modelos para evitar interferencias.","D":"Sustituir Scrum por un modelo totalmente secuencial."},"correctAnswer":"B","explanation":"En un modelo híbrido, las prácticas deben coordinarse. Las necesidades regulatorias no desaparecen por utilizar Agile y deben integrarse en la gestión del testing."},{"id":6,"chapter":1,"topic":"Sequential vs Iterative","level":"K2","difficulty":"medium","question":"¿Cuál combinación describe mejor una diferencia típica entre un modelo secuencial y uno iterativo?","options":{"A":"Secuencial: testing continuo; Iterativo: testing al final.","B":"Secuencial: sin automatización; Iterativo: solo pruebas automatizadas.","C":"Secuencial: reporting por hitos; Iterativo: reporting más continuo.","D":"Secuencial: sin Test Manager; Iterativo: Test Manager obligatorio."},"correctAnswer":"C","explanation":"El syllabus contrasta reporting más orientado a hitos en modelos secuenciales con reporting más continuo en modelos iterativos."},{"id":7,"chapter":1,"topic":"Test Levels","level":"K3","difficulty":"medium-high","question":"Un producto presenta alto riesgo en la integración con un servicio externo. ¿En qué nivel debería el Test Manager reforzar especialmente alcance, objetivos y seguimiento?","options":{"A":"System Integration Testing","B":"Solo Component Testing","C":"Solo Acceptance Testing","D":"Únicamente Static Testing"},"correctAnswer":"A","explanation":"System Integration Testing se orienta a validar interacciones entre sistemas y debe alinearse con los riesgos de integración."},{"id":8,"chapter":1,"topic":"Test Types","level":"K3","difficulty":"medium-high","question":"Un sistema cumple funcionalmente, pero negocio exige que responda en menos de dos segundos bajo carga. ¿Qué enfoque de gestión corresponde principalmente?","options":{"A":"White-box testing management","B":"Functional testing management","C":"Black-box testing management","D":"Non-functional testing management"},"correctAnswer":"D","explanation":"Performance es una característica no funcional y requiere criterios, ambientes y recursos específicos."},{"id":9,"chapter":1,"topic":"Risk-Based Testing","level":"K4","difficulty":"high","question":"Se identifican tres riesgos:\n\n- R1: error de etiqueta, likelihood alta, impact bajo.\n- R2: doble débito, likelihood media, impact crítico.\n- R3: lentitud en pantalla secundaria, likelihood media, impact medio.\n\nHay tiempo para intensificar solo una línea de pruebas. ¿Cuál debería priorizarse?","options":{"A":"R1, porque tiene mayor likelihood.","B":"R2, porque el nivel de riesgo combina likelihood e impact.","C":"R3, porque tiene likelihood e impact equilibrados.","D":"R1 y R3 por igual, porque ambos ocurren con más frecuencia."},"correctAnswer":"B","explanation":"El nivel de riesgo depende de likelihood e impact. Un impacto crítico puede justificar mayor prioridad aun con likelihood media."},{"id":10,"chapter":1,"topic":"Risk Identification","level":"K3","difficulty":"medium-high","question":"El Test Manager organiza una sesión de identificación de riesgos, pero solo invita a QA y desarrollo. Posteriormente negocio identifica un riesgo crítico de impacto financiero que nadie había considerado. ¿Qué problema se evidencia?","options":{"A":"Se usó una técnica demasiado formal.","B":"La sesión debió limitarse a riesgos técnicos.","C":"Faltó representación adecuada de stakeholders relevantes.","D":"El riesgo debía descubrirse únicamente durante ejecución."},"correctAnswer":"C","explanation":"La identificación de riesgos debe involucrar una muestra amplia de stakeholders relevantes para evitar omisiones significativas."},{"id":11,"chapter":1,"topic":"Quality Risk Assessment","level":"K4","difficulty":"high","question":"Un equipo intenta asignar valores monetarios exactos al impacto de todos los riesgos, pero no dispone de datos históricos confiables. ¿Qué enfoque es más apropiado?","options":{"A":"Utilizar una evaluación cualitativa con escalas ordinales de likelihood e impact.","B":"Inventar valores promedio para poder multiplicarlos.","C":"Eliminar el análisis de impacto y usar solo likelihood.","D":"Usar únicamente número de casos de prueba como indicador de riesgo."},"correctAnswer":"A","explanation":"Cuando no existen datos estadísticos suficientes, el syllabus permite una evaluación cualitativa basada en escalas como High, Medium y Low."},{"id":12,"chapter":1,"topic":"Risk Likelihood","level":"K2","difficulty":"medium","question":"¿Cuál factor está más relacionado con la likelihood de un quality risk?","options":{"A":"Daño reputacional potencial.","B":"Pérdida de ingresos por fallo.","C":"Criticidad del objetivo de negocio.","D":"Alta tasa de cambios en requisitos y personal."},"correctAnswer":"D","explanation":"La tasa de cambios, la complejidad, la madurez y los skills influyen en likelihood. Daño reputacional y pérdidas se relacionan más con impact."},{"id":13,"chapter":1,"topic":"Risk Impact","level":"K2","difficulty":"medium","question":"¿Cuál elemento influye principalmente en el impact de un riesgo?","options":{"A":"Madurez del equipo.","B":"Daño reputacional y pérdida de ingresos.","C":"Complejidad de la arquitectura.","D":"Disponibilidad del personal."},"correctAnswer":"B","explanation":"Impact considera consecuencias como reputación, ingresos, sanciones, seguridad y criticidad del negocio."},{"id":14,"chapter":1,"topic":"Risk Mitigation","level":"K4","difficulty":"high","question":"Una funcionalidad crítica presenta riesgo alto. El equipo tiene un QA Senior, dos QA Mid y tiempo limitado. ¿Cuál distribución es más coherente con Risk-Based Testing?","options":{"A":"Asignar al QA Senior a los elementos de mayor riesgo y usar técnicas más rigurosas allí.","B":"Distribuir el esfuerzo exactamente igual entre todas las funcionalidades.","C":"Asignar al QA Senior a los casos más simples para acelerar ejecución.","D":"Postergar la funcionalidad crítica hasta el final para tener más información."},"correctAnswer":"A","explanation":"Los elementos de mayor riesgo deben recibir mayor rigor, atención temprana y personal con las capacidades más fuertes."},{"id":15,"chapter":1,"topic":"Heavyweight vs Lightweight RBT","level":"K3","difficulty":"medium-high","question":"Un sistema de soporte vital requiere análisis formal, documentación detallada y participación amplia de stakeholders. ¿Qué enfoque encaja mejor?","options":{"A":"Lightweight Risk-Based Testing.","B":"Exploratory Testing como único enfoque.","C":"Heavyweight Risk-Based Testing.","D":"Planning Poker."},"correctAnswer":"C","explanation":"Los contextos safety-critical suelen requerir técnicas heavyweight, con mayor formalidad y profundidad."},{"id":16,"chapter":1,"topic":"Heavyweight RBT Techniques","level":"K2","difficulty":"medium","question":"¿Cuál técnica pertenece a los ejemplos heavyweight mencionados en el syllabus?","options":{"A":"Planning Poker","B":"Wideband Delphi","C":"PRAM","D":"Failure Mode and Effects Analysis (FMEA)"},"correctAnswer":"D","explanation":"FMEA, Hazard Analysis, Cost of Exposure y Fault Tree Analysis son ejemplos heavyweight."},{"id":17,"chapter":1,"topic":"Test Strategy vs Test Approach","level":"K3","difficulty":"medium-high","question":"Una organización define que las pruebas se priorizarán según riesgo. Para un proyecto concreto se decide usar API testing automatizado, regresión UI y pruebas exploratorias. ¿Cuál afirmación es correcta?","options":{"A":"La priorización por riesgo es parte de la estrategia; las técnicas concretas forman parte del approach.","B":"Ambas decisiones son únicamente Test Completion.","C":"La automatización es siempre estrategia y no approach.","D":"La estrategia solo existe a nivel organizacional."},"correctAnswer":"A","explanation":"Strategy define la dirección general; Approach concreta niveles, tipos, técnicas y prácticas."},{"id":18,"chapter":1,"topic":"SMART Objectives","level":"K3","difficulty":"medium-high","question":"¿Cuál objetivo está mejor formulado según SMART?","options":{"A":"Probar muy bien las funcionalidades críticas.","B":"Mejorar la calidad antes de producción.","C":"Ejecutar todos los tests asociados a riesgos altos antes del cierre de la iteración y cumplir los exit criteria definidos.","D":"Reducir defectos tanto como sea posible."},"correctAnswer":"C","explanation":"El objetivo debe ser específico, medible, alcanzable, relevante y limitado en el tiempo."},{"id":19,"chapter":1,"topic":"Exit Criteria","level":"K4","difficulty":"high","question":"Un equipo define como exit criterion “calidad aceptable”. Durante el cierre hay discusión porque nadie sabe si se cumplió. ¿Cuál es la mejor corrección?","options":{"A":"Mantenerlo porque negocio puede decidir subjetivamente.","B":"Reemplazarlo por criterios medibles relacionados con test objectives.","C":"Sustituirlo por “100% de casos passed” en todos los proyectos.","D":"Eliminar exit criteria para evitar ambigüedad."},"correctAnswer":"B","explanation":"Los exit criteria deben ser medibles y vinculados con los objetivos de prueba; no existe una regla universal como “100% passed”."},{"id":20,"chapter":1,"topic":"IDEAL","level":"K3","difficulty":"medium-high","question":"Después de una retrospectiva se concluye que la preparación tardía de datos es la principal causa de bloqueos. El equipo ya diagnosticó el problema y ahora define responsables, fechas y acciones para corregirlo. ¿Qué fase de IDEAL corresponde?","options":{"A":"Initiating","B":"Diagnosing","C":"Establishing","D":"Learning"},"correctAnswer":"C","explanation":"Establishing consiste en definir el plan concreto de mejora una vez diagnosticada la situación."},{"id":21,"chapter":1,"topic":"Retrospectives","level":"K4","difficulty":"high","question":"En tres iteraciones consecutivas se reporta “ambiente inestable”, pero nunca se genera una acción específica. ¿Cuál es la debilidad principal de la retrospectiva?","options":{"A":"Se está utilizando demasiado pronto.","B":"Se limita a identificar problemas sin convertirlos en acciones de mejora.","C":"Debería enfocarse solo en defectos de código.","D":"Las retrospectivas no deben tratar ambientes."},"correctAnswer":"B","explanation":"Una retrospectiva útil debe traducir hallazgos en acciones concretas y verificables de mejora."},{"id":22,"chapter":1,"topic":"Tool Selection","level":"K4","difficulty":"high","question":"Un equipo propone migrar de Selenium a otra herramienta porque “es más moderna”. ¿Qué debería solicitar primero el Test Manager?","options":{"A":"Una evaluación de compatibilidad, costos, beneficios, riesgos, skills e integración.","B":"La eliminación inmediata del framework actual.","C":"Aprobar la migración porque las herramientas nuevas siempre reducen mantenimiento.","D":"Comparar únicamente la velocidad de ejecución."},"correctAnswer":"A","explanation":"La selección de herramientas debe considerar factores técnicos y de negocio, además de riesgos, costos y beneficios."},{"id":23,"chapter":1,"topic":"Tool Lifecycle","level":"K3","difficulty":"medium-high","question":"Un vendor anuncia el fin de soporte de una herramienta utilizada por el equipo. ¿Qué aspecto del Tool Lifecycle cobra mayor importancia?","options":{"A":"Risk Identification del producto.","B":"Retirement y preservación/migración de datos.","C":"Component Testing.","D":"Defect Prevention."},"correctAnswer":"B","explanation":"En retirement deben considerarse reemplazo, preservación, archivo y migración de datos."},{"id":24,"chapter":1,"topic":"Tool Metrics","level":"K3","difficulty":"medium-high","question":"¿Qué herramienta es la más apropiada para proporcionar directamente información como response time y failure rate bajo carga?","options":{"A":"Requirements management tool","B":"Defect management tool","C":"Static analysis tool","D":"Performance testing tool"},"correctAnswer":"D","explanation":"Las herramientas de performance proporcionan métricas de comportamiento bajo carga, como tiempos de respuesta y tasas de fallo."},{"id":25,"chapter":1,"topic":"RBT Success Metrics","level":"K4","difficulty":"high","question":"Al revisar la efectividad de Risk-Based Testing, el equipo detecta que varios tests omitidos correspondían a riesgos más altos que muchos tests ejecutados. ¿Qué indica esto?","options":{"A":"La priorización basada en riesgo no se aplicó correctamente.","B":"El RBT fue exitoso porque se ejecutaron más tests.","C":"Los riesgos altos deben omitirse para reducir costo.","D":"El problema pertenece únicamente a Test Completion."},"correctAnswer":"A","explanation":"Una señal esperada de RBT efectivo es que las pruebas omitidas tengan menor riesgo que las ejecutadas."},{"id":26,"chapter":2,"topic":"Project / Product / Process Metrics","level":"K3","difficulty":"medium-high","question":"¿Cuál combinación clasifica mejor las métricas?","options":{"A":"% tests executed = Product; defect density = Project; test efficiency = Product.","B":"% tests executed = Project; defect density = Product; test efficiency = Process.","C":"% tests executed = Process; defect density = Project; test efficiency = Product.","D":"Todas son Project Metrics."},"correctAnswer":"B","explanation":"El progreso corresponde a Project Metrics; atributos del producto a Product Metrics; efectividad/eficiencia a Process Metrics."},{"id":27,"chapter":2,"topic":"Metrics Interpretation","level":"K4","difficulty":"high","question":"Un dashboard muestra 96% Passed. El 4% fallido corresponde a dos pruebas de transferencias de riesgo alto. ¿Cuál es la interpretación más apropiada?","options":{"A":"El producto está listo porque supera 95% Passed.","B":"El porcentaje no es suficiente; debe analizarse junto con riesgos, severidad y exit criteria.","C":"El 4% puede ignorarse por ser pequeño.","D":"Solo debe revisarse si existen defectos críticos en producción."},"correctAnswer":"B","explanation":"Las métricas deben interpretarse en contexto. Un porcentaje alto puede ocultar fallos importantes en áreas de alto riesgo."},{"id":28,"chapter":2,"topic":"Monitoring / Control Metrics","level":"K3","difficulty":"medium-high","question":"¿Cuál métrica es particularmente útil durante Monitoring y Control para detectar desviaciones del plan?","options":{"A":"Actual vs planned estimation in hours.","B":"Número total de reuniones realizadas.","C":"Cantidad de documentos generados.","D":"Número de personas del equipo."},"correctAnswer":"A","explanation":"Comparar esfuerzo real contra estimado permite identificar desviaciones y aplicar acciones de control."},{"id":29,"chapter":2,"topic":"Test Reporting","level":"K4","difficulty":"high","question":"¿Cuál reporte aporta más valor a un stakeholder que debe decidir sobre una release?","options":{"A":"“420 Passed, 18 Failed.”","B":"“Se ejecutó el 95% del alcance; 3 de los 18 fallos afectan riesgos altos y dos exit criteria aún no se cumplen.”","C":"“Se ejecutaron muchas pruebas esta semana.”","D":"“QA recomienda esperar porque todavía hay bugs.”"},"correctAnswer":"B","explanation":"El reporte debe traducir datos en información útil para decidir, vinculando resultados, riesgos y criterios."},{"id":30,"chapter":2,"topic":"Test Estimation","level":"K4","difficulty":"high","question":"Un equipo calcula 16 horas porque 80 casos tardan 12 minutos cada uno. Sin embargo, requiere preparar datos manualmente, ejecutar regresión y hacer re-testing. ¿Cuál es el problema principal?","options":{"A":"La estimación solo considera ejecución y omite otras actividades necesarias.","B":"Doce minutos por caso nunca es una medida válida.","C":"La estimación debería basarse únicamente en defectos históricos.","D":"La regresión no debe incluirse en estimaciones."},"correctAnswer":"A","explanation":"La estimación debe considerar el conjunto de actividades de testing y factores del contexto, no solo tiempo de ejecución."},{"id":31,"chapter":2,"topic":"Estimation Technique Selection","level":"K4","difficulty":"high","question":"Un proyecto nuevo tiene alta complejidad, poca información histórica y varios expertos disponibles. ¿Qué enfoque es más apropiado?","options":{"A":"Solo ratio-based estimation.","B":"Solo extrapolation.","C":"Una técnica basada en expertos, como Wideband Delphi.","D":"Estimar únicamente por número de casos."},"correctAnswer":"C","explanation":"Con alta complejidad y pocos datos históricos, las técnicas expert-based son más adecuadas."},{"id":32,"chapter":2,"topic":"Three-Point Estimation","level":"K3","difficulty":"medium-high","question":"¿Por qué Three-Point Estimation es útil frente a una única estimación?","options":{"A":"Elimina completamente la incertidumbre.","B":"Utiliza optimistic, most likely y pessimistic para representar incertidumbre.","C":"No requiere conocimiento del trabajo.","D":"Solo puede utilizarse en Agile."},"correctAnswer":"B","explanation":"La técnica incorpora distintos escenarios de esfuerzo y permite representar la variabilidad de la estimación."},{"id":33,"chapter":2,"topic":"Ratio-Based Estimation","level":"K3","difficulty":"medium-high","question":"¿En qué contexto tiene más sentido utilizar ratio-based estimation?","options":{"A":"Cuando existen datos históricos confiables de proyectos similares.","B":"Cuando no existe información histórica ni expertos.","C":"Cuando el proyecto es completamente desconocido y altamente innovador.","D":"Solo cuando se utiliza Scrum."},"correctAnswer":"A","explanation":"Ratio-based estimation depende de relaciones obtenidas de información histórica relevante y confiable."},{"id":34,"chapter":2,"topic":"Planning Poker vs Wideband Delphi","level":"K3","difficulty":"medium-high","question":"Un equipo Agile necesita estimar trabajo durante planificación de iteración. ¿Qué técnica encaja mejor con el contexto según el syllabus?","options":{"A":"Fault Tree Analysis","B":"Planning Poker","C":"FMEA","D":"Hazard Analysis"},"correctAnswer":"B","explanation":"Planning Poker es una técnica basada en el equipo ampliamente adecuada para contextos Agile."},{"id":35,"chapter":2,"topic":"Defect Lifecycle","level":"K4","difficulty":"high","question":"Una prueba automatizada falla. Antes de crear un defecto del producto se descubre que el script tenía un selector incorrecto. ¿Qué principio demuestra este caso?","options":{"A":"Todo test fallido debe generar un defecto.","B":"Una anomalía requiere investigación porque no siempre implica un defecto del producto.","C":"Los fallos de automatización son External Failures.","D":"Los scripts no forman parte del proceso de defect management."},"correctAnswer":"B","explanation":"Una discrepancia observada puede originarse en producto, ambiente, datos, automatización o interpretación; debe investigarse."},{"id":36,"chapter":2,"topic":"Cross-Functional Defect Management","level":"K4","difficulty":"high","question":"Un equipo utiliza una buena herramienta de defectos, pero desarrollo y QA casi no conversan. Los defectos permanecen días sin clarificación. ¿Cuál es la mejor conclusión?","options":{"A":"La herramienta debería sustituirse.","B":"La comunicación es innecesaria si el workflow está configurado.","C":"La herramienta no sustituye una comunicación efectiva entre participantes.","D":"El problema pertenece solo al Product Owner."},"correctAnswer":"C","explanation":"Effective Defect Management requiere comunicación, herramienta adecuada, workflow y participación de los stakeholders."},{"id":37,"chapter":2,"topic":"Agile Defect Management","level":"K4","difficulty":"high","question":"En un equipo Agile co-located se detecta un defecto que puede corregirse inmediatamente en la misma iteración. ¿Qué enfoque es coherente con el syllabus?","options":{"A":"Siempre debe existir un defect report formal antes de corregirlo.","B":"Puede gestionarse de forma ligera si el contexto lo permite y el acuerdo del equipo está definido.","C":"Debe esperar a la siguiente iteración.","D":"Debe escalarse al comité de defectos."},"correctAnswer":"B","explanation":"En Agile, Defect Management puede ser menos formal. El nivel de formalidad depende del contexto y de los acuerdos del equipo."},{"id":38,"chapter":2,"topic":"Hybrid Defect Management","level":"K4","difficulty":"high","question":"Un equipo Agile usa Jira y un proveedor secuencial usa otra herramienta. Los defectos críticos no se reflejan a tiempo entre equipos. ¿Qué acción es más apropiada?","options":{"A":"Mantener los sistemas totalmente independientes.","B":"Pedir que QA copie manualmente todo al final de cada sprint.","C":"Establecer alineación de atributos y sincronización entre herramientas, preferiblemente automatizada.","D":"Eliminar el seguimiento de defectos del proveedor."},"correctAnswer":"C","explanation":"En contextos híbridos, uno de los retos clave es alinear atributos, herramientas y visibilidad de defectos entre equipos."},{"id":39,"chapter":2,"topic":"Defect Report Information","level":"K3","difficulty":"medium-high","question":"¿Cuál conjunto representa información fundamental para gestionar un defecto?","options":{"A":"Título, descripción, pasos, severity y priority.","B":"Nombre del sprint, cantidad de testers y presupuesto.","C":"Únicamente screenshot y severity.","D":"Únicamente título y responsable."},"correctAnswer":"A","explanation":"El syllabus destaca título, descripción detallada, pasos para reproducir, severity y priority como información esencial."},{"id":40,"chapter":2,"topic":"Defect Data for Process Improvement","level":"K4","difficulty":"high","question":"Durante varios meses aumenta el porcentaje de defectos reabiertos. ¿Cuál análisis es más útil?","options":{"A":"Evaluar la calidad de las correcciones/debugging y buscar causas recurrentes.","B":"Eliminar el estado Reopened del workflow.","C":"Cerrar automáticamente defectos después del primer fix.","D":"Medir únicamente cuántos casos fueron ejecutados."},"correctAnswer":"A","explanation":"La información sobre reopened defects puede utilizarse para evaluar la calidad del debugging y detectar oportunidades de mejora."},{"id":41,"chapter":3,"topic":"Four Areas of Competence","level":"K3","difficulty":"medium-high","question":"Un QA domina técnicas de prueba y APIs, pero presenta dificultad para manejar conflictos dentro del equipo. ¿Qué área de competencia necesita principalmente fortalecer?","options":{"A":"Professional competence","B":"Methodological competence","C":"Social competence","D":"Personal competence"},"correctAnswer":"C","explanation":"Conflict management, comunicación y cooperación pertenecen principalmente a Social Competence."},{"id":42,"chapter":3,"topic":"Professional Competence","level":"K2","difficulty":"medium","question":"¿Cuál ejemplo corresponde principalmente a Professional Competence?","options":{"A":"Conocimiento de test techniques y dominio de negocio.","B":"Capacidad de recibir críticas.","C":"Resolución de conflictos interpersonales.","D":"Adaptabilidad social."},"correctAnswer":"A","explanation":"Professional Competence incluye conocimientos especializados, técnicas de testing, tecnología y dominio de negocio."},{"id":43,"chapter":3,"topic":"Required Skills","level":"K4","difficulty":"high","question":"Un proyecto requiere API testing, performance y conocimiento bancario. El equipo tiene experiencia fuerte en API y banca, pero nadie domina performance. ¿Cuál es la respuesta más apropiada?","options":{"A":"Ignorar performance porque el equipo actual no tiene el skill.","B":"Ejecutar performance con cualquier QA sin preparación.","C":"Identificar el gap y cubrirlo mediante desarrollo de skills o apoyo externo.","D":"Reemplazar a todo el equipo."},"correctAnswer":"C","explanation":"La gestión debe comparar skills requeridos contra disponibles y cerrar gaps mediante training, desarrollo o expertos externos."},{"id":44,"chapter":3,"topic":"Methodological Competence","level":"K3","difficulty":"medium-high","question":"Un QA debe analizar una historia ambigua, identificar riesgos y decidir qué información necesita antes de diseñar pruebas. ¿Qué competencia resulta especialmente relevante?","options":{"A":"Social competence","B":"Methodological competence","C":"Hygiene factor","D":"External failure competence"},"correctAnswer":"B","explanation":"Analytical, conceptual y judgment skills forman parte de Methodological Competence."},{"id":45,"chapter":3,"topic":"Personal Competence","level":"K3","difficulty":"medium-high","question":"Un Test Lead técnicamente fuerte tiene problemas para delegar, aceptar feedback y adaptarse a cambios. ¿Qué área debería desarrollar principalmente?","options":{"A":"Professional competence","B":"Social competence","C":"Personal competence","D":"Appraisal competence"},"correctAnswer":"C","explanation":"Delegación, capacidad de recibir críticas, resiliencia y apertura al cambio son ejemplos de Personal Competence."},{"id":46,"chapter":3,"topic":"Motivators vs Hygiene Factors","level":"K4","difficulty":"high","question":"El equipo recibe reconocimiento, autonomía y oportunidades de crecimiento, pero trabaja con ambientes extremadamente inestables y objetivos poco realistas. ¿Qué interpretación es más adecuada?","options":{"A":"Los motivators compensan completamente cualquier problema de condiciones.","B":"Los ambientes y objetivos poco realistas son hygiene factors cuya ausencia puede desmotivar.","C":"La autonomía es un hygiene factor.","D":"El reconocimiento es un external failure cost."},"correctAnswer":"B","explanation":"Condiciones de trabajo y objetivos realistas pertenecen a Hygiene Factors. Su ausencia puede producir desmotivación aunque existan motivators."},{"id":47,"chapter":3,"topic":"Cost of Quality","level":"K3","difficulty":"medium-high","question":"Clasifique correctamente las siguientes actividades:\n\n1. Training de desarrolladores en secure coding.\n2. Ejecución de pruebas.\n3. Corrección de un bug encontrado en QA.\n4. Hotfix por defecto detectado en producción.","options":{"A":"Prevention, Appraisal, Internal Failure, External Failure","B":"Appraisal, Prevention, External Failure, Internal Failure","C":"Prevention, Internal Failure, Appraisal, External Failure","D":"Appraisal, Appraisal, Internal Failure, Prevention"},"correctAnswer":"A","explanation":"Training previene; testing detecta; corregir antes de release es Internal Failure; corregir después de release es External Failure."},{"id":48,"chapter":3,"topic":"Prevention vs Appraisal","level":"K3","difficulty":"medium-high","question":"¿Cuál actividad es un Prevention Cost y no un Appraisal Cost?","options":{"A":"Dynamic Testing","B":"Revisar tempranamente el test basis para prevenir problemas posteriores.","C":"Ejecutar regresión.","D":"Analizar resultados de performance."},"correctAnswer":"B","explanation":"Prevention busca evitar problemas antes de que ocurran; Appraisal busca detectarlos mediante evaluación o testing."},{"id":49,"chapter":3,"topic":"Cost-Benefit of Testing","level":"K4","difficulty":"high","question":"Un stakeholder propone duplicar indefinidamente el esfuerzo de testing “para asegurar calidad”. ¿Qué respuesta está más alineada con el syllabus?","options":{"A":"Más testing siempre produce mejor retorno.","B":"El objetivo es encontrar un equilibrio donde el beneficio esperado justifique el costo y el riesgo residual.","C":"El testing debe detenerse al alcanzar 50% de cobertura.","D":"El costo no debe considerarse en decisiones de calidad."},"correctAnswer":"B","explanation":"El syllabus plantea que tanto testing insuficiente como excesivo pueden ser perjudiciales; debe buscarse un equilibrio costo-beneficio."},{"id":50,"chapter":3,"topic":"Integrated Test Management Decision","level":"K4","difficulty":"high","question":"Un proyecto regulado tiene deadline cercano, defectos críticos en una integración de alto riesgo, un ambiente inestable y solo un QA Senior disponible. ¿Cuál respuesta combina mejor los principios de Test Management?","options":{"A":"Mantener el plan original para no afectar el cronograma.","B":"Ejecutar primero todos los casos fáciles para elevar el porcentaje de avance.","C":"Repriorizar según riesgo, asignar al QA Senior al área crítica, ajustar el plan y comunicar el impacto a stakeholders.","D":"Suspender todo testing hasta estabilizar completamente el ambiente."},"correctAnswer":"C","explanation":"La respuesta combina Risk-Based Testing, asignación de skills, Test Control y comunicación con stakeholders frente a una desviación real."}]}</script>
<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  // ---------- Persistencia local (solo comodidad; la página funciona sin ella) ----------
  const store = (() => {
    const KEY = 'ctaltm-estudio-v1';
    let data = {};
    try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { data = {}; }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* sin almacenamiento */ } };
    return {
      get: (k, d) => (Object.prototype.hasOwnProperty.call(data, k) ? data[k] : d),
      set: (k, v) => { data[k] = v; save(); },
    };
  })();

  // ---------- Tema ----------
  const root = document.documentElement;
  const applyTheme = (t) => { if (t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); drawThemeIcon(); };
  const isDark = () => {
    const t = root.getAttribute('data-theme');
    if (t) return t === 'dark';
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  };
  function drawThemeIcon() {
    const icon = $('#theme-icon');
    if (!icon) return;
    icon.innerHTML = isDark()
      ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
      : '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>';
    $('#theme-btn').setAttribute('aria-label', isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
  }
  applyTheme(store.get('theme', null));
  $('#theme-btn').addEventListener('click', () => { const next = isDark() ? 'light' : 'dark'; applyTheme(next); store.set('theme', next); });
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawThemeIcon); } catch (e) {} }

  // ---------- Utilidades de texto ----------
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const plain = (s) => s.replace(/\*\*/g, '').replace(/`/g, '').replace(/^[#>|\-\s]+/gm, ' ').replace(/\|/g, ' ');
  const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  // ---------- Parser del resumen (contenido literal del MD) ----------
  function parseTable(rows) {
    const cells = (r) => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
    const head = cells(rows[0]);
    const align = cells(rows[1]).map((c) => (/:$/.test(c) ? 'right' : 'left'));
    return { t: 'table', head, align, rows: rows.slice(2).map(cells) };
  }
  function parseBlocks(lines) {
    const out = [];
    const special = (l) => /^(#{2,6} |\||>|- |\d+\. )/.test(l) || /^---\s*$/.test(l);
    let i = 0;
    while (i < lines.length) {
      const l = lines[i];
      let m;
      if (!l.trim() || /^---\s*$/.test(l)) { i++; continue; }
      if ((m = l.match(/^(#{2,6}) (.+)$/))) { out.push({ t: 'h', level: m[1].length, text: m[2].trim() }); i++; continue; }
      if (l.startsWith('|')) { const r = []; while (i < lines.length && lines[i].startsWith('|')) r.push(lines[i++]); out.push(parseTable(r)); continue; }
      if (l.startsWith('>')) { const q = []; while (i < lines.length && lines[i].startsWith('>')) q.push(lines[i++].replace(/^> ?/, '').trim()); out.push({ t: 'quote', lines: q.filter(Boolean) }); continue; }
      if (/^- /.test(l)) { const it = []; while (i < lines.length && /^- /.test(lines[i])) it.push(lines[i++].slice(2).trim()); out.push({ t: 'ul', items: it }); continue; }
      if (/^\d+\. /.test(l)) { const it = []; while (i < lines.length && /^\d+\. /.test(lines[i])) it.push(lines[i++].replace(/^\d+\. /, '').trim()); out.push({ t: 'ol', items: it }); continue; }
      const p = [];
      while (i < lines.length && lines[i].trim() && !special(lines[i])) p.push(lines[i++].trim());
      out.push({ t: 'p', text: p.join(' ') });
    }
    return out;
  }

  const md = $('#summary-md').textContent;
  const sections = [];
  {
    let cur = null;
    for (const line of md.split('\n')) {
      const m = line.match(/^# (.+)$/);
      if (m) { cur = { title: m[1].trim(), lines: [] }; sections.push(cur); } else if (cur) cur.lines.push(line.replace(/\s+$/, ''));
    }
  }
  sections.forEach((s) => {
    const m = s.title.match(/^(\d+(?:\.\d+)*)\.?\s+(.+)$/);
    s.num = m ? m[1] : null;
    s.name = m ? m[2] : s.title;
    s.group = s.num ? s.num.split('.')[0] : '0';
    s.depth = s.num ? s.num.split('.').length : 0;
    s.id = s.num ? 'sec-' + s.num.replace(/\./g, '-') : 'sec-intro';
    s.blocks = parseBlocks(s.lines);
    s.text = plain(s.lines.join('\n')).replace(/\s+/g, ' ').trim();
  });
  const byId = Object.fromEntries(sections.map((s) => [s.id, s]));
  const groups = [...new Set(sections.map((s) => s.group))];
  const leadOf = (g) => sections.find((s) => s.num === g);
  const groupSecs = (g) => sections.filter((s) => s.group === g);
  const trackable = sections.filter((s) => s.num);

  // Tiempo de formación por capítulo, tomado de la tabla de "0. Visión general"
  const chapterTime = {};
  (leadOf('0') ? leadOf('0').blocks : []).forEach((b) => {
    if (b.t === 'table' && /Cap/i.test(b.head[0])) b.rows.forEach((r) => { chapterTime[r[0]] = r[2]; });
  });
  const groupEyebrow = (g) => (g === '0' ? 'Inicio' : ['1', '2', '3'].includes(g) ? `Capítulo ${g}${chapterTime[g] ? ' · ' + chapterTime[g] : ''}` : `Sección ${g}`);

  // ---------- Render de bloques ----------
  const EXAM = /^(Idea central|Idea clave|Idea importante|Idea|Importante|Diferencia clave|Principio|Regla conceptual del syllabus|Resumen)$/i;
  function kindOf(title, group) {
    if (group === '8') return /^Muy/i.test(title) ? 'prio-high' : 'prio';
    if (group === '9') return 'lo';
    if (/^Ejemplo/i.test(title)) return 'example';
    if (EXAM.test(title)) return 'exam';
    return 'default';
  }
  let loCounter = 0;
  function renderList(items, kind) {
    if (kind === 'lo') {
      return '<ul class="checklist">' + items.map((it) => {
        const id = 'lo-' + (loCounter++);
        return `<li><label for="${id}"><input type="checkbox" id="${id}" data-lo="${id}"><span>${inline(it)}</span></label></li>`;
      }).join('') + '</ul>';
    }
    const short = items.length >= 3 && items.every((it) => plain(it).length <= 34 && !it.includes('→'));
    if (short) return `<ul class="chips${kind && kind.startsWith('prio') ? ' ' + kind : ''}">${items.map((i) => `<li>${inline(i)}</li>`).join('')}</ul>`;
    return `<ul class="list">${items.map((i) => `<li>${inline(i).replace(/ → /g, ' <span class="arr">→</span> ')}</li>`).join('')}</ul>`;
  }
  function renderFlow(text) {
    return '<ol class="flow">' + text.split('→').map((p) => `<li><span>${inline(p.trim())}</span></li>`).join('') + '</ol>';
  }
  function quadrant(b) {
    const hi = (v) => norm(v) === 'alta';
    const find = (inf, int) => b.rows.find((r) => hi(r[1]) === inf && hi(r[2]) === int);
    const cell = (r, hot) => r ? `<div class="cell${hot ? ' hot' : ''}"><b>${esc(r[0])}</b><span>Influencia ${esc(r[1].toLowerCase())} · Interés ${esc(r[2].toLowerCase())}</span></div>` : '<div class="cell"></div>';
    return `<div class="quad" aria-label="Matriz de stakeholders: influencia frente a interés">
      <div class="ax y">Influencia ↑</div>
      ${cell(find(true, false))}${cell(find(true, true), true)}
      ${cell(find(false, false))}${cell(find(false, true))}
      <div></div><div class="ax x">Interés →</div></div>`;
  }
  function renderTable(b) {
    const isNum = b.align.map((a, ci) => a === 'right' && b.rows.every((r) => /^\d/.test(r[ci] || '')));
    const max = isNum.map((n, ci) => (n ? Math.max(...b.rows.map((r) => parseFloat(r[ci]))) : 0));
    const cell = (c, ci) => {
      if (c === 'Sí') return '<span class="yn yes">Sí</span>';
      if (c === 'No') return '<span class="yn no">No</span>';
      if (isNum[ci]) { const v = parseFloat(c); return `<div class="bar-cell"><span class="bar" style="--w:${(v / max[ci] * 100).toFixed(1)}%"></span><span class="num">${esc(c)}</span></div>`; }
      return inline(c);
    };
    const cls = b.head.length === 2 ? ' class="versus"' : '';
    let html = `<div class="table-wrap"><table${cls}><thead><tr>${b.head.map((h, ci) => `<th${b.align[ci] === 'right' && !isNum[ci] ? ' class="r"' : ''}>${inline(h)}</th>`).join('')}</tr></thead><tbody>`;
    html += b.rows.map((r) => `<tr>${r.map((c, ci) => `<td>${cell(c, ci)}</td>`).join('')}</tr>`).join('');
    html += '</tbody></table></div>';
    if (b.head[0] === 'Tipo' && b.head.includes('Influencia')) html += quadrant(b);
    return html;
  }
  function renderBlocks(bs, kind) {
    let out = '';
    bs.forEach((b, idx) => {
      const prev = bs[idx - 1];
      if (b.t === 'p') {
        const t = b.text;
        if (/^\*\*[^*]*→[^*]*\*\*$/.test(t)) out += renderFlow(t.slice(2, -2));
        else if (/^`[^`]+`$/.test(t)) out += `<div class="formula">${esc(t.slice(1, -1))}</div>`;
        else if (/^\*\*[^*]+\*\*$/.test(t)) out += `<p class="statement">${inline(t)}</p>`;
        else out += `<p>${inline(t)}</p>`;
      } else if (b.t === 'quote') {

        out += `<blockquote class="q${cls}">${b.lines.map((l) => `<p>${inline(l)}</p>`).join('')}</blockquote>`;

      else if (b.t === 'table') out += renderTable(b);

    });

  // ---------- Buscador ----------
  const searchInput = $('#search'); const results = $('#results');
  const index = trackable.map((s) => ({ s, n: norm(s.num + ' ' + s.name), t: norm(s.text) }));
  let resSel = 0; let resList = [];
  function highlight(raw, terms) {
    const n = norm(raw);
    if (n.length !== raw.length) return esc(raw);
    const marks = new Array(raw.length).fill(false);
    terms.forEach((t) => { let p = n.indexOf(t); while (p !== -1 && t) { for (let k = p; k < p + t.length; k++) marks[k] = true; p = n.indexOf(t, p + t.length); } });
    let out = ''; let open = false;
    for (let k = 0; k < raw.length; k++) {
      if (marks[k] && !open) { out += '<mark>'; open = true; }
      if (!marks[k] && open) { out += '</mark>'; open = false; }
      out += esc(raw[k]);
    }
    return out + (open ? '</mark>' : '');
  }
  function doSearch() {
    const q = norm(searchInput.value.trim());
    if (q.length < 2) { results.hidden = true; return; }
    const terms = q.split(/\s+/).filter(Boolean);
    resList = index.map((e) => {
      let score = 0;
      for (const t of terms) {
        const inName = e.n.includes(t);
        const count = e.t.split(t).length - 1;
        if (!inName && !count) return null;
        score += (inName ? 20 : 0) + Math.min(count, 6);
      }
      return { e, score };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 10);

  // ---------- Repaso rápido (tarjetas desde la sección 7) ----------
  const cardsState = { order: TERMS.map((_, i) => i), pos: 0, flipped: false, onlyPending: false };
  function cardPool() {
    const cards = store.get('cards', {});

  }
  function renderCards() {
    const view = $('#view-cards');

    const pool = cardPool();
    if (cardsState.pos >= pool.length) cardsState.pos = 0;
    const known = TERMS.filter((t) => cards[t.term] === 'known').length;
    const i = pool[cardsState.pos];
    const t = TERMS[i];
    const status = t ? cards[t.term] : null;

    view.innerHTML = `
      <header class="view-head"><p class="eyebrow">Sección 7 · Conceptos para repaso rápido</p><h1>Repaso rápido</h1>

      </button></div>
      <div class="flash-ctrl">
        <div class="grp"><button class="btn" data-c="prev" aria-label="Anterior">←</button><span class="flash-count">${cardsState.pos + 1} / ${pool.length}</span><button class="btn" data-c="next" aria-label="Siguiente">→</button></div>
        <div class="grp"><button class="btn warn" data-c="again">Repasar otra vez</button><button class="btn good" data-c="known">Lo domino</button></div>
      </div>` : `<div class="source-note"><p>No quedan conceptos pendientes. Desactiva “Solo pendientes” para ver todos.</p></div>`}
      <div class="flash-ctrl">
        <div class="grp"><label class="toggle"><input type="checkbox" id="only-pending" ${cardsState.onlyPending ? 'checked' : ''}> Solo pendientes</label></div>
        <div class="grp"><button class="btn ghost" data-c="shuffle">Barajar</button><button class="btn ghost" data-c="reset">Reiniciar marcas</button></div>
      </div>

  }
  function cardAct(c) {
    const pool = cardPool();
    const cards = { ...store.get('cards', {}) };
    if (c === 'flip') { cardsState.flipped = !cardsState.flipped; const f = $('#flash'); if (f) f.classList.toggle('flipped', cardsState.flipped); return; }
    if (c === 'prev') { cardsState.pos = (cardsState.pos - 1 + pool.length) % pool.length; cardsState.flipped = false; }
    if (c === 'next') { cardsState.pos = (cardsState.pos + 1) % pool.length; cardsState.flipped = false; }

      const o = cardsState.order;
      for (let k = o.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [o[k], o[j]] = [o[j], o[k]]; }

  $('#view-cards').addEventListener('click', (e) => {

    'Retrospectives': '1.5.4', 'Tool Selection': '1.6.3', 'Tool Lifecycle': '1.6.4', 'Tool Metrics': '1.6.5', 'RBT Success Metrics': '1.3.7',
    'Project / Product / Process Metrics': '2.1.1', 'Metrics Interpretation': '2.1.3', 'Monitoring / Control Metrics': '2.1.2',
    'Test Reporting': '2.1.3', 'Test Estimation': '2.2.1', 'Estimation Technique Selection': '2.2.2', 'Three-Point Estimation': '2.2.3',
    'Ratio-Based Estimation': '2.2.4', 'Planning Poker vs Wideband Delphi': '2.2.7', 'Defect Lifecycle': '2.3.1',
    'Cross-Functional Defect Management': '2.3.2', 'Agile Defect Management': '2.3.3', 'Hybrid Defect Management': '2.3.4',
    'Defect Report Information': '2.3.5', 'Defect Data for Process Improvement': '2.3.6', 'Four Areas of Competence': '3.1',
    'Professional Competence': '3.1.1', 'Required Skills': '3.2', 'Methodological Competence': '3.1.2', 'Personal Competence': '3.1.4',
    'Motivators vs Hygiene Factors': '3.5', 'Cost of Quality': '3.6', 'Prevention vs Appraisal': '3.6.1', 'Cost-Benefit of Testing': '3.7',
    'Integrated Test Management Decision': '1.1.3',
  };
  const secFor = (q) => { const n = TOPIC_SEC[q.topic]; return n ? byId['sec-' + n.replace(/\./g, '-')] : null; };
  const CH_NAME = { 1: leadOf('1') ? leadOf('1').name : '', 2: leadOf('2') ? leadOf('2').name : '', 3: leadOf('3') ? leadOf('3').name : '' };
  const LEVELS = ['K2', 'K3', 'K4'];
  const DIFFS = ['medium', 'medium-high', 'high'];
  const countBy = (list, key) => list.reduce((a, q) => ((a[q[key]] = (a[q[key]] || 0) + 1), a), {});

  let quiz = null; // { list, pos, answers, revealed, mode, confirm, finished, filter }
  const prefs = () => ({ chapter: 'all', levels: LEVELS.slice(), diffs: DIFFS.slice(), mode: 'practice', shuffle: true, onlyWrong: false, ...store.get('quizPrefs', {}) });
  function filtered(p) {
    const wrong = new Set(store.get('quizWrong', []));
    return QS.filter((q) => (p.chapter === 'all' || String(q.chapter) === p.chapter) && p.levels.includes(q.level) && p.diffs.includes(q.difficulty) && (!p.onlyWrong || wrong.has(q.id)));
  }
  function distTile(title, counts, keys, labels) {
    const max = Math.max(...keys.map((k) => counts[k] || 0), 1);
    return `<div class="tile"><span class="k">${title}</span><div class="rows">${keys.map((k) => `<div><span>${labels ? labels[k] : k}</span><span class="track"><i style="--w:${(counts[k] || 0) / max * 100}%"></i></span><span>${counts[k] || 0}</span></div>`).join('')}</div></div>`;
  }
  function renderSetup(view) {
    const p = prefs();
    const wrongN = store.get('quizWrong', []).length;
    const n = filtered(p).length;
    const hist = store.get('quizHistory', []);
    const chCount = countBy(QS, 'chapter');
    view.innerHTML = `
      <header class="view-head"><p class="eyebrow">Banco de preguntas · ${QS.length}</p><h1>Práctica tipo examen</h1>
        <p>Preguntas de escenario sobre los tres capítulos, con la explicación de cada respuesta y un enlace a la sección del resumen que conviene repasar.</p></header>
      <div class="dist">
        ${distTile('Por capítulo', chCount, [1, 2, 3], { 1: 'Cap. 1', 2: 'Cap. 2', 3: 'Cap. 3' })}
        ${distTile('Por nivel K', countBy(QS, 'level'), LEVELS)}
        ${distTile('Por dificultad', countBy(QS, 'difficulty'), DIFFS)}
      </div>
      <form class="qform" id="qform">
        <fieldset><legend>Capítulo</legend><div class="pills">
          ${[['all', 'Todos', QS.length], ['1', 'Cap. 1 · ' + CH_NAME[1], chCount[1]], ['2', 'Cap. 2 · ' + CH_NAME[2], chCount[2]], ['3', 'Cap. 3 · ' + CH_NAME[3], chCount[3]]].map(([v, l, c]) =>
            `<label class="pill"><input type="radio" name="chapter" id="qf-ch-${v}" value="${v}" ${p.chapter === v ? 'checked' : ''}><span>${esc(l)} <small>${c}</small></span></label>`).join('')}
        </div></fieldset>
        <fieldset><legend>Nivel cognitivo</legend><div class="pills">
          ${LEVELS.map((l) => `<label class="pill"><input type="checkbox" name="levels" id="qf-lv-${l}" value="${l}" ${p.levels.includes(l) ? 'checked' : ''}><span>${l}</span></label>`).join('')}
        </div></fieldset>
        <fieldset><legend>Dificultad</legend><div class="pills">
          ${DIFFS.map((d) => `<label class="pill"><input type="checkbox" name="diffs" id="qf-df-${d}" value="${d}" ${p.diffs.includes(d) ? 'checked' : ''}><span>${d}</span></label>`).join('')}
        </div></fieldset>
        <fieldset><legend>Modo</legend><div class="mode-cards">
          <label class="mode-card"><input type="radio" name="mode" id="qf-mode-practice" value="practice" ${p.mode === 'practice' ? 'checked' : ''}><span><b>Práctica</b><small>Ves si acertaste y la explicación justo después de responder.</small></span></label>
          <label class="mode-card"><input type="radio" name="mode" id="qf-mode-exam" value="exam" ${p.mode === 'exam' ? 'checked' : ''}><span><b>Simulacro</b><small>Respondes todo sin ayuda, puedes volver atrás y ves el resultado al final.</small></span></label>
        </div></fieldset>
        <fieldset><legend>Opciones</legend><div class="pills">
          <label class="pill"><input type="checkbox" name="shuffle" id="qf-shuffle" ${p.shuffle ? 'checked' : ''}><span>Orden aleatorio</span></label>
          <label class="pill"><input type="checkbox" name="onlyWrong" id="qf-wrong" ${p.onlyWrong ? 'checked' : ''} ${wrongN ? '' : 'disabled'}><span>Solo las que fallé <small>${wrongN}</small></span></label>
        </div></fieldset>
        <div class="actions"><span class="muted" id="qf-count">${n} preguntas seleccionadas</span>
          <button class="btn primary" type="submit" id="qf-start" ${n ? '' : 'disabled'}>Empezar · ${n} preguntas</button></div>
      </form>
      ${hist.length ? `<div class="history"><h2>Intentos recientes</h2>${hist.slice(0, 5).map((h) =>
        `<div class="hist-row"><span>${esc(h.date)} · ${h.mode === 'exam' ? 'Simulacro' : 'Práctica'}</span><span class="muted">${h.correct}/${h.total}</span><span class="pct">${h.pct}%</span></div>`).join('')}</div>` : ''}`;
  }
  function readForm(form) {
    const fd = new FormData(form);
    return { chapter: fd.get('chapter') || 'all', levels: fd.getAll('levels'), diffs: fd.getAll('diffs'), mode: fd.get('mode') || 'practice', shuffle: !!fd.get('shuffle'), onlyWrong: !!fd.get('onlyWrong') };
  }
  function startQuiz(list, mode) {
    quiz = { list, pos: 0, answers: {}, revealed: {}, mode, confirm: false, finished: false, filter: 'all' };
    renderQuiz(); window.scrollTo(0, 0);
  }
  function renderQText(text) { return renderBlocks(parseBlocks(text.split('\n')), 'default'); }
  function optsHtml(q, chosen, reveal, disabled) {
    return `<div class="opts" role="group" aria-label="Opciones">${['A', 'B', 'C', 'D'].map((L) => {
      let cls = '';
      if (reveal) { if (L === q.correctAnswer) cls = ' correct'; else if (L === chosen) cls = ' wrong'; } else if (L === chosen) cls = ' sel';
      return `<button class="opt${cls}" data-opt="${L}" ${disabled ? 'disabled' : ''} aria-pressed="${L === chosen}"><span class="L">${L}</span><span>${inline(q.options[L])}</span></button>`;
    }).join('')}</div>`;
  }
  function studyLink(q) { const s = secFor(q); return s ? `<a class="study-link" href="#${s.id}">Repasar en el resumen: ${esc(s.num)} ${inline(s.name)} →</a>` : ''; }
  function metaHtml(q) {
    return `<div class="q-meta"><span class="chip">Cap. ${q.chapter}</span><span class="chip">${esc(q.topic)}</span><span class="chip k">${esc(q.level)}</span><span class="chip d-${esc(q.difficulty)}">${esc(q.difficulty)}</span><span class="qid">#${q.id}</span></div>`;
  }
  function renderQuestion(view) {
    const { list, pos, answers, revealed, mode } = quiz;
    const q = list[pos];
    const chosen = answers[q.id];
    const reveal = mode === 'practice' && revealed[q.id];
    const answeredN = Object.keys(answers).length;
    const correctN = list.filter((x) => revealed[x.id] && answers[x.id] === x.correctAnswer).length;
    const last = pos === list.length - 1;
    let fb = '';
    if (reveal) {
      const ok = chosen === q.correctAnswer;
      fb = `<div class="feedback ${ok ? 'ok' : 'ko'}" role="status"><span class="verdict">${ok ? '✓ Correcto' : `✗ Incorrecto · la respuesta correcta es ${q.correctAnswer}`}</span><p>${inline(q.explanation)}</p>${studyLink(q)}</div>`;
    }
    const nextBtn = mode === 'practice'
      ? (reveal ? `<button class="btn primary" data-q="${last ? 'finish' : 'next'}">${last ? 'Ver resultado' : 'Siguiente →'}</button>` : '<span class="muted">Elige una opción</span>')
      : `<button class="btn primary" data-q="${last ? 'finish' : 'next'}">${last ? 'Finalizar simulacro' : 'Siguiente →'}</button>`;
    view.innerHTML = `
      <div class="q-top"><button class="btn ghost" data-q="exit">← Salir</button>
        <span class="q-count">Pregunta ${pos + 1} de ${list.length}${mode === 'practice' ? ` · ${correctN} aciertos` : ` · ${answeredN} respondidas`}</span></div>
      <div class="q-bar"><i style="--w:${((mode === 'practice' ? Object.keys(revealed).length : answeredN) / list.length * 100).toFixed(1)}%"></i></div>
      <article class="qcard">${metaHtml(q)}<div class="q-text">${renderQText(q.question)}</div>${optsHtml(q, chosen, reveal, reveal)}${fb}</article>
      <div class="q-nav">${mode === 'exam' ? `<button class="btn" data-q="prev" ${pos === 0 ? 'disabled' : ''}>← Anterior</button>` : '<span></span>'}${nextBtn}</div>
      ${mode === 'exam' ? `<div class="palette" aria-label="Ir a pregunta">${list.map((x, k) => `<button data-goto="${k}" class="${answers[x.id] ? 'ans' : ''}${k === pos ? ' cur' : ''}" aria-label="Pregunta ${k + 1}">${k + 1}</button>`).join('')}</div>
        ${quiz.confirm ? `<div class="confirm"><span>Te quedan ${list.length - answeredN} preguntas sin responder. ¿Finalizar de todos modos?</span><span><button class="btn" data-q="cancel">Seguir respondiendo</button> <button class="btn primary" data-q="finish-force">Finalizar</button></span></div>` : ''}
        <p class="kbd-hint"><kbd>A</kbd>–<kbd>D</kbd> para responder · <kbd>←</kbd> <kbd>→</kbd> para moverte</p>` : '<p class="kbd-hint"><kbd>A</kbd>–<kbd>D</kbd> para responder · <kbd>Enter</kbd> para continuar</p>'}`;
  }
  function finishQuiz() {
    const { list, answers, mode } = quiz;
    quiz.finished = true; quiz.confirm = false;
    const correct = list.filter((q) => answers[q.id] === q.correctAnswer).length;
    const pct = Math.round(correct / list.length * 100);
    const wrong = new Set(store.get('quizWrong', []));
    list.forEach((q) => { if (answers[q.id] === q.correctAnswer) wrong.delete(q.id); else if (answers[q.id]) wrong.add(q.id); });
    store.set('quizWrong', [...wrong].sort((a, b) => a - b));
    const d = new Date();
    const date = d.toLocaleDateString('es', { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
    store.set('quizHistory', [{ date, mode, total: list.length, correct, pct }, ...store.get('quizHistory', [])].slice(0, 10));
    refreshProgress();
    renderQuiz(); window.scrollTo(0, 0);
  }
  function breakdownTile(title, keyFn, keys, labels) {
    const { list, answers } = quiz;
    const rows = keys.map((k) => {
      const sub = list.filter((q) => keyFn(q) === k);
      if (!sub.length) return '';
      const ok = sub.filter((q) => answers[q.id] === q.correctAnswer).length;
      const p = Math.round(ok / sub.length * 100);
      return `<div><span>${labels ? labels[k] : k}</span><span class="track"><i style="--w:${p}%;--c:${p >= 50 ? 'var(--pass)' : 'var(--fail)'}"></i></span><span>${ok}/${sub.length}</span></div>`;
    }).join('');
    return `<div class="tile"><span class="k">${title}</span><div class="rows">${rows}</div></div>`;
  }
  function renderResults(view) {
    const { list, answers, filter } = quiz;
    const correct = list.filter((q) => answers[q.id] === q.correctAnswer).length;
    const pct = Math.round(correct / list.length * 100);
    const unanswered = list.filter((q) => !answers[q.id]).length;
    const failed = list.filter((q) => answers[q.id] !== q.correctAnswer);
    const shown = list.filter((q) => filter === 'all' || (filter === 'wrong' ? answers[q.id] && answers[q.id] !== q.correctAnswer : filter === 'none' ? !answers[q.id] : false));
    view.innerHTML = `
      <div class="score-head"><div class="ring" style="--p:${pct};--c:${pct >= 50 ? 'var(--pass)' : 'var(--fail)'}"><div>${pct}%</div></div>
        <div><p class="eyebrow">${quiz.mode === 'exam' ? 'Resultado del simulacro' : 'Resultado de la práctica'}</p><h1>${correct} de ${list.length} correctas</h1>
        <p>${list.length - correct - unanswered} incorrectas${unanswered ? ` · ${unanswered} sin responder` : ''}. Revisa abajo la explicación de cada pregunta.</p></div></div>
      <div class="breakdown dist">
        ${breakdownTile('Por capítulo', (q) => q.chapter, [1, 2, 3], { 1: 'Cap. 1', 2: 'Cap. 2', 3: 'Cap. 3' })}
        ${breakdownTile('Por nivel K', (q) => q.level, LEVELS)}
        ${breakdownTile('Por dificultad', (q) => q.difficulty, DIFFS)}
      </div>
      <div class="results-actions">
        ${failed.length ? `<button class="btn primary" data-q="retry-failed">Repetir las ${failed.length} falladas</button>` : ''}
        <button class="btn" data-q="exit">Nueva práctica</button></div>
      <div class="review-filter"><h2>Revisión</h2>
        <div class="pills">${[['all', 'Todas', list.length], ['wrong', 'Incorrectas', list.length - correct - unanswered], ['none', 'Sin responder', unanswered]].map(([v, l, c]) =>
          `<label class="pill"><input type="radio" name="rf" id="rf-${v}" value="${v}" ${filter === v ? 'checked' : ''}><span>${l} <small>${c}</small></span></label>`).join('')}</div></div>
      ${shown.map((q) => {
        const a = answers[q.id];
        const st = !a ? 'na' : a === q.correctAnswer ? 'ok' : 'ko';
        return `<details class="rev"><summary><span class="mk ${st}">${st === 'ok' ? '✓' : st === 'ko' ? '✗' : '–'}</span>
          <span class="st">${esc(q.topic)}<small>#${q.id} · Cap. ${q.chapter} · ${esc(q.level)} · ${esc(q.difficulty)}</small></span>
          <span class="ans">${a ? 'tu: ' + a : 'sin resp.'} · ok: ${q.correctAnswer}</span></summary>
          <div class="body"><div class="q-text">${renderQText(q.question)}</div>${optsHtml(q, a, true, true)}
          <div class="feedback"><p>${inline(q.explanation)}</p>${studyLink(q)}</div></div></details>`;
      }).join('') || '<p class="muted">No hay preguntas en este filtro.</p>'}`;
  }
  function renderQuiz() {
    const view = $('#view-quiz');
    if (!quiz) renderSetup(view);
    else if (quiz.finished) renderResults(view);
    else renderQuestion(view);
  }
  function answer(L) {
    if (!quiz || quiz.finished) return;
    const q = quiz.list[quiz.pos];
    if (quiz.mode === 'practice') {
      if (quiz.revealed[q.id]) return;
      quiz.answers[q.id] = L; quiz.revealed[q.id] = true;
    } else {
      quiz.answers[q.id] = L; quiz.confirm = false;
    }
    renderQuiz();
    const fb = $('.feedback', $('#view-quiz'));
    if (fb) fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  function qAct(a) {
    if (a === 'exit') { quiz = null; renderQuiz(); window.scrollTo(0, 0); return; }
    if (a === 'next') { if (quiz.pos < quiz.list.length - 1) quiz.pos++; quiz.confirm = false; }
    if (a === 'prev') { if (quiz.pos > 0) quiz.pos--; quiz.confirm = false; }
    if (a === 'cancel') quiz.confirm = false;
    if (a === 'finish') {
      const left = quiz.list.filter((q) => !quiz.answers[q.id]).length;
      if (quiz.mode === 'exam' && left) { quiz.confirm = true; renderQuiz(); return; }
      return finishQuiz();
    }
    if (a === 'finish-force') return finishQuiz();
    if (a === 'retry-failed') { const f = quiz.list.filter((q) => quiz.answers[q.id] !== q.correctAnswer); return startQuiz(f, quiz.mode); }
    renderQuiz(); window.scrollTo(0, 0);
  }
  const viewQuiz = $('#view-quiz');
  viewQuiz.addEventListener('click', (e) => {
    const o = e.target.closest('[data-opt]'); if (o && !o.disabled && !o.closest('.rev')) return answer(o.dataset.opt);
    const b = e.target.closest('[data-q]'); if (b) return qAct(b.dataset.q);
    const g = e.target.closest('[data-goto]'); if (g) { quiz.pos = Number(g.dataset.goto); quiz.confirm = false; renderQuiz(); }
  });
  viewQuiz.addEventListener('change', (e) => {
    if (e.target.name === 'rf') { quiz.filter = e.target.value; renderQuiz(); return; }
    const form = e.target.closest('#qform');
    if (!form) return;
    const p = readForm(form);
    store.set('quizPrefs', p);
    const n = filtered(p).length;
    $('#qf-count').textContent = `${n} preguntas seleccionadas`;
    const btn = $('#qf-start'); btn.disabled = !n; btn.textContent = `Empezar · ${n} preguntas`;
  });
  viewQuiz.addEventListener('submit', (e) => {
    e.preventDefault();
    const p = readForm(e.target);
    store.set('quizPrefs', p);
    let list = filtered(p);
    if (!list.length) return;
    if (p.shuffle) { list = list.slice(); for (let k = list.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [list[k], list[j]] = [list[j], list[k]]; } }
    startQuiz(list, p.mode);
  });

  // Teclado en práctica y tarjetas
  document.addEventListener('keydown', (e) => {
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (currentView === 'quiz' && quiz && !quiz.finished) {
      const k = e.key.toUpperCase();
      const map = { A: 'A', B: 'B', C: 'C', D: 'D', 1: 'A', 2: 'B', 3: 'C', 4: 'D' };
      if (map[k]) { e.preventDefault(); return answer(map[k]); }
      const q = quiz.list[quiz.pos];
      if ((e.key === 'Enter' || e.key === 'ArrowRight') && document.activeElement.tagName !== 'BUTTON') {
        if (quiz.mode === 'exam' || quiz.revealed[q.id]) { e.preventDefault(); qAct(quiz.pos === quiz.list.length - 1 ? 'finish' : 'next'); }
      }
      if (e.key === 'ArrowLeft' && quiz.mode === 'exam') { e.preventDefault(); qAct('prev'); }
    } else if (currentView === 'cards') {
      if (e.key === ' ' && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); cardAct('flip'); }
      if (e.key === 'ArrowRight') cardAct('next');
      if (e.key === 'ArrowLeft') cardAct('prev');
    }
  });

  // ---------- Inicio ----------
  route();
  refreshProgress();
})();
</script>

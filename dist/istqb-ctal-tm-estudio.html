<title>Estudio CTAL-TM v3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: barra superior fija + índice lateral por capítulos + columna de lectura.
   Repaso rápido y Práctica son vistas propias. Colores de estado tomados del vocabulario
   de un test report: passed (verde), failed (rojo), blocked (ámbar). */
:root {
  --bg: #f2f5f5;
  --surface: #ffffff;
  --surface-2: #e8eeee;
  --ink: #132227;
  --muted: #56696e;
  --line: #d3dedf;
  --line-strong: #a9bbbe;
  --accent: #0c6770;
  --accent-ink: #ffffff;
  --accent-soft: #dcefef;
  --accent-line: #9ccfd2;
  --pass: #1b7a43;
  --pass-soft: #def2e6;
  --fail: #b3372f;
  --fail-soft: #f8e2df;
  --blocked: #98600c;
  --blocked-soft: #faedd5;
  --shadow: 0 1px 2px rgba(19, 34, 39, .06), 0 8px 24px rgba(19, 34, 39, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, "Courier New", monospace;
  --top-h: 60px;
  --side-w: 290px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1618; --surface: #142024; --surface-2: #1a292d; --ink: #e1ebeb; --muted: #93a8ac;
    --line: #25363a; --line-strong: #3d5459; --accent: #52bcc5; --accent-ink: #062024;
    --accent-soft: #143539; --accent-line: #2b6a70; --pass: #5bc68a; --pass-soft: #15301f;
    --fail: #f07d73; --fail-soft: #3a1d1a; --blocked: #e4ab50; --blocked-soft: #33270f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1618; --surface: #142024; --surface-2: #1a292d; --ink: #e1ebeb; --muted: #93a8ac;
  --line: #25363a; --line-strong: #3d5459; --accent: #52bcc5; --accent-ink: #062024;
  --accent-soft: #143539; --accent-line: #2b6a70; --pass: #5bc68a; --pass-soft: #15301f;
  --fail: #f07d73; --fail-soft: #3a1d1a; --blocked: #e4ab50; --blocked-soft: #33270f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(var(--top-h) + 16px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
p { margin: 0; }
code { font-family: var(--f-mono); font-size: .92em; background: var(--surface-2); padding: 1px 6px; border-radius: 5px; }
strong { font-weight: 600; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
.muted { color: var(--muted); }

/* ---------- Barra superior ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  height: var(--top-h); display: flex; align-items: center; gap: 14px;
  padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.menu-btn { display: none; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); display: inline-grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn:hover { border-color: var(--line-strong); }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); flex: none; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
.brand span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.search { position: relative; flex: 1; max-width: 520px; margin-inline: auto; min-width: 0; }
.search input {
  width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 0 12px 0 38px; font: inherit; font-size: 15px;
}
.search input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.search > svg { position: absolute; left: 12px; top: 11px; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }
.search kbd { position: absolute; right: 10px; top: 10px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.results {
  position: absolute; top: 46px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); max-height: min(70vh, 520px); overflow: auto; padding: 6px;
}
.res { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 10px 12px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.res:hover, .res.on { background: var(--accent-soft); }
.res .rnum { font-family: var(--f-mono); font-size: 12px; color: var(--accent); padding-top: 2px; }
.res .rtitle { font-weight: 600; }
.res .rsnip { grid-column: 2; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.res mark, .flash-hit { background: var(--blocked-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.res-empty { padding: 14px; color: var(--muted); font-size: 14px; }
.top-prog { display: flex; align-items: center; gap: 10px; flex: none; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.top-prog .track { width: 90px; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.top-prog .track i { display: block; height: 100%; width: var(--w, 0%); background: var(--pass); transition: width .3s; }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); }
.sidebar {
  position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px));
  height: calc(100vh - var(--top-h)); overflow-y: auto; border-right: 1px solid var(--line);
  background: var(--surface); padding: 16px 12px 40px;
}
.modes { display: grid; gap: 4px; padding-bottom: 14px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.mode {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px;
  text-decoration: none; color: var(--ink); font-weight: 500;
}
.mode svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mode small { margin-left: auto; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.mode:hover { background: var(--surface-2); }
.mode.on { background: var(--accent); color: var(--accent-ink); }
.mode.on small { color: inherit; opacity: .8; }
.toc-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 12px 8px; }
.toc-g {
  display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: start; padding: 8px 10px;
  border-radius: 9px; text-decoration: none; color: var(--ink); font-size: 14.5px; line-height: 1.35;
}
.toc-g:hover { background: var(--surface-2); }
.toc-g.on { background: var(--accent-soft); font-weight: 600; }
.toc-g .gnum { font-family: var(--f-mono); font-size: 12px; color: var(--accent); padding-top: 2px; }
.toc-g .gcount { font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding-top: 2px; }
.toc-g .gcount.full { color: var(--pass); }
.toc-secs { list-style: none; margin: 2px 0 8px; padding: 0 0 0 26px; }
.toc-secs a {
  display: flex; gap: 8px; padding: 5px 10px; border-radius: 7px; text-decoration: none;
  color: var(--muted); font-size: 13.5px; line-height: 1.35;
}
.toc-secs a:hover { color: var(--ink); background: var(--surface-2); }
.toc-secs a.cur { color: var(--ink); background: var(--surface-2); }
.toc-secs a .n { font-family: var(--f-mono); font-size: 11.5px; min-width: 34px; padding-top: 1px; }
.toc-secs a.d3 { padding-left: 22px; }
.toc-secs a.done .n { color: var(--pass); }
.toc-secs a.done::after { content: "✓"; margin-left: auto; color: var(--pass); font-size: 12px; }
.scrim { display: none; }

main { min-width: 0; padding: 32px clamp(16px, 4vw, 56px) 96px; }
.view { max-width: 900px; margin: 0 auto; }

/* ---------- Estudio ---------- */
.hero { padding-block: 8px 28px; display: grid; gap: 14px; }
.hero h1 { font-size: clamp(2rem, 5.5vw, 3.3rem); font-weight: 800; letter-spacing: -.02em; }
.hero .sub { font-size: 1.1rem; color: var(--muted); }
.source-note { border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; background: var(--surface); font-size: 14.5px; color: var(--muted); display: grid; gap: 4px; }

.dash { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 8px 0 28px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; align-content: start; }
.tile .k { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tile .v { font-family: var(--f-display); font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.tile .v small { font-size: .9rem; color: var(--muted); font-weight: 600; font-family: var(--f-body); }
.tile .track { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.tile .track i { display: block; height: 100%; width: var(--w, 0%); background: var(--c, var(--accent)); }
.tile a { font-size: 14px; font-weight: 600; text-decoration: none; }
.tile a:hover { text-decoration: underline; }
.chap-bars { display: grid; gap: 6px; font-size: 13px; }
.chap-bars div { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; font-family: var(--f-mono); color: var(--muted); }
.chap-bars .track { height: 6px; }

.group-head { display: grid; gap: 10px; padding-bottom: 20px; }
.group-head h1 { font-size: clamp(1.8rem, 4.5vw, 2.6rem); font-weight: 800; letter-spacing: -.015em; }
.group-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; color: var(--muted); }
.group-meta .track { width: 140px; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.group-meta .track i { display: block; height: 100%; width: var(--w, 0%); background: var(--pass); }

.sec { padding-block: 30px; border-top: 1px solid var(--line); scroll-margin-top: calc(var(--top-h) + 12px); }
.sec.depth-2 { border-top: 2px solid var(--ink); margin-top: 18px; }
.sec.lead { border-top: 0; padding-top: 0; }
.sec-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
.sec-head .num { font-family: var(--f-mono); font-size: 13px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 3px 8px; margin-top: 3px; flex: none; font-weight: 600; }
.sec-head h2 { font-size: 1.45rem; font-weight: 700; flex: 1; min-width: 0; }
.sec.depth-2 .sec-head h2 { font-size: 1.8rem; font-weight: 800; }
.sec.lead .sec-head { justify-content: flex-end; }
.done-btn {
  flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
  background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--muted);
}
.done-btn:hover { border-color: var(--pass); color: var(--pass); }
.done-btn[aria-pressed="true"] { background: var(--pass-soft); border-color: var(--pass); color: var(--pass); font-weight: 600; }
.done-btn .box { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid currentColor; display: inline-grid; place-items: center; font-size: 10px; line-height: 1; }
.sec.flash-on { animation: flashsec 1.6s ease-out; }
@keyframes flashsec { 0% { background: var(--accent-soft); } 100% { background: transparent; } }

.sec-body { display: grid; gap: 14px; }
.sec-body > p, .sub > p, .concept > p, .mini > p { max-width: 68ch; }
.sec-body h3 { font-size: 1.12rem; font-weight: 700; }
.sec-body h4 { font-size: 1rem; font-weight: 700; font-family: var(--f-body); }
.sub { display: grid; gap: 12px; margin-top: 8px; }
.sub-exam { background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 12px; padding: 16px 20px; }
.sub-example { background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 12px; padding: 16px 20px; }
.tag { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--accent); display: inline-flex; align-items: center; gap: 6px; margin-bottom: -4px; }
.sub-example .tag { color: var(--blocked); }
.sub-example .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sub-exam .tag::before { content: "!"; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-grid; place-items: center; font-size: 11px; }
.statement { font-family: var(--f-display); font-size: 1.12rem; font-weight: 600; }
.statement strong { font-weight: 700; }

.card-grid, .mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.concept, .mini { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.sub-example .concept { background: var(--surface); }
.concept h4, .mini h3 { font-family: var(--f-display); font-size: 1.02rem; font-weight: 700; }

ul.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
ul.chips li { padding: 3px 11px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); font-size: 14px; line-height: 1.5; }
.sub-exam ul.chips li, .sub-example ul.chips li { background: var(--surface); }
ul.chips.prio-high li { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
ul.chips.prio li { border-color: var(--accent-line); }
ul.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; max-width: 70ch; }
ul.list li { position: relative; padding-left: 18px; }
ul.list li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 6px; height: 6px; border-radius: 2px; background: var(--accent); }
.arr { color: var(--accent); font-weight: 600; }
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: st; max-width: 70ch; }
ol.steps li { counter-increment: st; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: baseline; }
ol.steps li::before { content: counter(st); font-family: var(--f-mono); font-size: 12px; font-weight: 600; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: inline-grid; place-items: center; }

ol.flow { list-style: none; margin: 4px 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
ol.flow li { display: flex; align-items: center; gap: 10px; }
ol.flow li span { padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--surface); font-weight: 600; font-size: 15px; }
ol.flow li:not(:last-child)::after { content: "→"; color: var(--accent); font-weight: 700; font-size: 18px; }
.formula { font-family: var(--f-mono); font-size: 1.15rem; padding: 14px 18px; border: 1.5px dashed var(--accent-line); border-radius: 10px; background: var(--surface); justify-self: start; }

blockquote.q { margin: 0; padding: 12px 16px; border-left: 3px solid var(--line-strong); background: var(--surface); border-radius: 0 10px 10px 0; font-style: italic; display: grid; gap: 4px; }
blockquote.q.bad { border-left-color: var(--fail); background: var(--fail-soft); }
blockquote.q.good { border-left-color: var(--pass); background: var(--pass-soft); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
th.r, td.r { text-align: right; }
table.versus th:first-child, table.versus td:first-child { border-right: 1px solid var(--line); }
table.versus th { font-family: var(--f-display); font-size: 15px; }
table.versus th:first-child { color: var(--accent); }
table.versus th:last-child { color: var(--blocked); }
.yn { display: inline-block; font-family: var(--f-mono); font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; }
.yn.yes { background: var(--pass-soft); color: var(--pass); }
.yn.no { background: var(--surface-2); color: var(--muted); }
.bar-cell { display: grid; grid-template-columns: minmax(60px, 1fr) auto; gap: 10px; align-items: center; min-width: 170px; }
.bar-cell .bar { height: 8px; border-radius: 99px; background: var(--surface-2); position: relative; overflow: hidden; }
.bar-cell .bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--accent); border-radius: 99px; }
.bar-cell .num { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }

.quad { display: grid; grid-template-columns: 26px 1fr 1fr; grid-template-rows: 1fr 1fr 26px; gap: 8px; max-width: 520px; }
.quad .cell { border-radius: 12px; padding: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; gap: 2px; min-height: 92px; align-content: center; }
.quad .cell b { font-family: var(--f-display); font-size: 1.05rem; }
.quad .cell span { font-size: 12.5px; color: var(--muted); font-family: var(--f-mono); }
.quad .cell.hot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.quad .cell.hot span { color: inherit; opacity: .85; }
.quad .ax { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: grid; place-items: center; letter-spacing: .06em; text-transform: uppercase; }
.quad .ax.y { writing-mode: vertical-rl; transform: rotate(180deg); grid-row: 1 / 3; }
.quad .ax.x { grid-column: 2 / 4; }

ul.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
ul.checklist label { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; align-items: start; }
ul.checklist label:hover { background: var(--surface-2); }
ul.checklist input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--pass); }
ul.checklist input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
.pager a { display: grid; gap: 2px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; color: var(--ink); min-width: 0; flex: 1 1 240px; }
.pager a:hover { border-color: var(--accent); }
.pager a small { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pager a.next { text-align: right; }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 15px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--line-strong); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 0 10px; }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.good { color: var(--pass); border-color: var(--pass); }
.btn.good:hover { background: var(--pass-soft); }
.btn.warn { color: var(--blocked); border-color: var(--blocked); }
.btn.warn:hover { background: var(--blocked-soft); }

/* ---------- Repaso rápido ---------- */
.view-head { display: grid; gap: 10px; padding-bottom: 22px; }

# 0. Visión general

## Certificación

**Certified Tester Advanced Level — Test Management v3.0**

El syllabus está orientado a profesionales involucrados en la gestión de pruebas de software.

La certificación cubre principalmente tres bloques:

1. **Managing the Test Activities**
2. **Managing the Product**
3. **Managing the Team**

## Distribución del contenido

| Capítulo | Tema | Tiempo de formación |
|---|---|---:|
| 1 | Managing the Test Activities | 750 min |
| 2 | Managing the Product | 390 min |
| 3 | Managing the Team | 225 min |

## Niveles cognitivos

### K2 — Understand
Comprender, explicar, resumir o diferenciar conceptos.

### K3 — Apply
Aplicar un concepto, técnica o método a una situación concreta.

### K4 — Analyze
Analizar un contexto, evaluar información y seleccionar una acción apropiada.

## Idea central

En Advanced Level no basta con memorizar términos.

El foco está en comprender cómo debe actuar una persona responsable de la gestión de pruebas ante distintos contextos, riesgos, restricciones, métricas, defectos y necesidades del equipo.

# 1.1 Test Process

El proceso de pruebas incluye actividades como:

- test planning
- test monitoring and control
- test analysis
- test design
- test implementation
- test execution
- test completion

En este syllabus, la gestión se concentra especialmente en:

- Test Planning
- Test Monitoring
- Test Control
- Test Completion

---

# 1.1.1 Test Planning

## Definición

Test Planning consiste en determinar cómo se alcanzarán los objetivos de prueba.

Debe considerar:

- contexto del proyecto
- alcance
- objetivos
- test approach
- riesgos
- recursos
- equipo
- herramientas
- ambientes
- datos
- calendario
- entregables
- stakeholders

La planificación debe comenzar lo antes posible y actualizarse conforme evoluciona el proyecto.

## Actividades principales

### Comprender el contexto

Se debe entender:

- estrategia organizacional
- políticas de prueba
- alcance
- test item
- restricciones
- stakeholders

### Identificar y analizar riesgos del producto

Los riesgos influyen en:

- prioridades
- técnicas
- esfuerzo
- cobertura
- secuencia de ejecución

### Definir tratamiento de riesgos

Las respuestas al riesgo pueden incluir:

- prevención
- mitigación
- corrección
- aceptación
- transferencia
- planes de contingencia

### Definir el test approach

Debe tomar en cuenta:

- estrategia organizacional
- regulaciones
- restricciones
- riesgos
- SDLC
- test levels
- test types
- técnicas

### Estimar y asignar recursos

Pueden incluir:

- personas
- tiempo
- herramientas
- ambientes
- infraestructura
- datos

### Establecer el test plan

El plan debe estar acordado con los stakeholders relevantes.

---

# 1.1.2 Test Monitoring

## Definición

Test Monitoring consiste en recopilar y analizar información sobre el estado y progreso del testing.

Ejemplos:

- pruebas ejecutadas
- passed
- failed
- blocked
- pendientes
- cobertura
- defectos
- esfuerzo consumido
- avance respecto al plan
- evolución de riesgos

## Ejemplo

Plan:

- 100 casos

Estado actual:

- 60 ejecutados
- 45 Passed
- 10 Failed
- 5 Blocked

Esto es **Test Monitoring**.

---

# 1.1.3 Test Control

## Definición

Test Control utiliza la información obtenida mediante Monitoring para tomar acciones que mantengan el testing alineado con los objetivos y el plan.

Ejemplos:

- repriorizar pruebas
- cambiar secuencia de ejecución
- reasignar recursos
- modificar el calendario
- revisar entry criteria
- revisar exit criteria
- tratar riesgos nuevos
- ajustar el plan
- escalar impedimentos

## Diferencia clave

**Monitoring = saber qué está pasando.**

**Control = decidir qué hacer con esa información.**

---

# 1.1.4 Test Completion

Test Completion ocurre normalmente en hitos como:

- fin de una iteración
- fin de un test level
- release
- cierre de proyecto

Incluye:

- crear el Test Completion Report
- aprobar y comunicar el cierre
- archivar testware
- entregar testware reutilizable
- comunicar defectos conocidos
- restaurar o limpiar ambientes
- documentar lessons learned
- identificar mejoras de proceso

## Idea clave

Finalizar la ejecución no equivale por sí solo a completar el proceso de testing.

# 1.2.1 Stakeholders

Los stakeholders tienen intereses diferentes respecto a la calidad y al testing.

Ejemplos:

- Developers
- Development Leads
- Development Managers
- Testers
- Test Leads
- Test Managers
- Project Managers
- Product Owners
- Business Users
- Operations
- Customers
- Users

## Ejemplos de intereses

### Developers
Necesitan información para corregir defectos y validar componentes.

### Testers
Necesitan requisitos, riesgos, datos, ambientes y criterios claros.

### Product Owners / Business
Necesitan información para decidir si el producto cumple necesidades y riesgos aceptables.

### Operations
Se interesa por readiness, estabilidad y comportamiento en producción.

### Customers / Users
Se interesan por utilidad, calidad y cumplimiento de necesidades.

# 1.2.2 Stakeholder Matrix

La matriz considera:

- influencia
- interés

| Tipo | Influencia | Interés |
|---|---|---|
| Promoters | Alta | Alta |
| Latents | Alta | Baja |
| Defenders | Baja | Alta |
| Apathetics | Baja | Baja |

## Promoters

Stakeholders muy relevantes para estrategia y decisiones.

## Latents

Tienen alto poder, aunque su interés cotidiano sea menor.

## Defenders

Tienen alto interés y pueden aportar feedback útil.

## Apathetics

Tienen bajo interés e influencia, pero pueden requerir comunicación puntual.

# 1.2.3 Hybrid Software Development

Un modelo híbrido combina elementos de distintos SDLC.

Puede aparecer por:

- transición hacia Agile
- regulación
- necesidades organizacionales
- partes del proyecto con distintos niveles de riesgo
- coexistencia de equipos con modelos distintos

En un contexto híbrido se requiere:

- flexibilidad
- colaboración
- comunicación
- coordinación entre equipos
- comprensión de los distintos modelos
- seguimiento de pruebas entre sprints y fases tradicionales

# 1.2.4 Sequential vs Iterative

| Aspecto | Sequential | Iterative / Agile |
|---|---|---|
| Estimación | Detallada desde etapas tempranas | Iterativa |
| Testware | Más formal y extenso | Más ligero |
| Roles | Test Manager más diferenciado | Roles integrados |
| Tools | Gestión por fases | CI/CD y automation importantes |
| Testing | Fases planificadas | Integrado en iteraciones |
| Automation | Estratégica | Desde etapas tempranas |
| Reporting | Por hitos | Continuo |
| Metrics | Métricas tradicionales | Tradicionales + métricas Agile |

# 1.2.6 Test Types

## Functional Testing

Foco en:

## Non-Functional Testing

## White-Box Testing

# 1.3 Risk-Based Testing

## Definición

Risk-Based Testing utiliza los riesgos para dirigir el testing.

Permite decidir:

- qué probar
- qué probar primero
- cuánto probar
- con qué rigor
- con qué técnicas
- durante cuánto tiempo

## Principio

A mayor nivel de riesgo:

- antes debe iniciar el testing
- más intenso debe ser
- más prolongado puede ser
- mayor rigor debe aplicarse

---

# 1.3.1 Estructura del Risk Management

El syllabus organiza el proceso en:

## Risk Analysis

Incluye:

- Risk Identification
- Risk Assessment

## Risk Control

Incluye:

- Risk Monitoring
- Risk Mitigation

Flujo conceptual:

**Identification → Assessment → Mitigation + Monitoring**

Estas actividades pueden solaparse.

---

# 1.3.2 Product Risk vs Project Risk

## Product Risk

Situación potencial donde puede existir un problema de calidad en el producto.

Ejemplos:

- cálculo financiero incorrecto
- vulnerabilidad
- transferencia duplicada
- pérdida de información
- integración incorrecta

## Project Risk

Riesgo que afecta la ejecución del proyecto.

Ejemplos:

- ambiente no disponible
- falta de personal
- presión de tiempo
- dependencia externa
- datos incompletos
- problemas de coordinación

## Importante

Risk-Based Testing se enfoca principalmente en **quality risks / product risks**.

---

# 1.3.3 Risk Identification

Técnicas mencionadas en el syllabus:

- Expert Interviews
- Independent Assessments
- Retrospectives
- Risk Workshops
- Brainstorming
- Checklists
- Past Experience

## Idea importante

La identificación debe involucrar una muestra amplia de stakeholders relevantes.

Omitir stakeholders importantes puede provocar que riesgos significativos no sean identificados.

---

# 1.3.4 Quality Risk Assessment

El risk level se determina principalmente mediante:

- Risk Likelihood
- Risk Impact

## Factores que influyen en Likelihood

Ejemplos:

- complejidad técnica
- herramientas
- arquitectura
- madurez organizacional
- skills
- disponibilidad del personal
- conflictos
- proveedores
- equipos distribuidos
- liderazgo débil
- presión de tiempo
- presión de presupuesto
- falta de QA temprano
- alta tasa de cambios

## Factores que influyen en Impact

Ejemplos:

- frecuencia de uso
- criticidad de la funcionalidad
- criticidad del objetivo de negocio
- daño reputacional
- pérdida de ingresos
- pérdidas financieras
- impacto ambiental o social
- sanciones legales
- problemas de integración
- falta de workaround
- necesidades de seguridad

## Riesgo cuantitativo

Si existen suficientes datos estadísticos válidos, el riesgo puede evaluarse cuantitativamente.

Ejemplo conceptual:

`Risk Level = Likelihood × Impact`

## Riesgo cualitativo

Es común utilizar escalas:

- Very High
- High
- Medium
- Low
- Very Low

y combinarlas mediante una matriz de riesgo.

---

# 1.3.5 Risk Mitigation

El esfuerzo de testing debe ser proporcional al riesgo.

Para riesgos altos:

- probar antes
- usar técnicas más rigurosas
- dedicar mayor esfuerzo
- utilizar personal más capacitado
- considerar más test levels
- considerar más test types
- combinar static y dynamic testing cuando corresponda

Para riesgos bajos:

- puede iniciar más tarde
- puede usar técnicas menos rigurosas

## Otras respuestas al riesgo

Además del testing pueden existir:

- contingency plan
- transferir riesgo
- aceptar riesgo

---

# 1.3.6 Heavyweight vs Lightweight Risk-Based Testing

## Heavyweight

Características:

- formal
- procedimientos definidos
- documentación detallada
- grupos amplios de stakeholders
- análisis más profundo
- fórmulas o factores detallados

Ejemplos mencionados:

- Hazard Analysis
- Cost of Exposure
- FMEA
- Fault Tree Analysis

Se usa frecuentemente en sistemas safety-critical.

## Lightweight

Características:

- menor esfuerzo
- menor formalidad
- menos stakeholders
- escalas ordinales
- focus en likelihood + impact

Ejemplos mencionados:

- SST
- PRAM
- PRISMA

Se utiliza con frecuencia en aplicaciones no safety-critical.

---

# 1.3.7 Success Metrics de Risk-Based Testing

Preguntas útiles para evaluar si funcionó:

- ¿Participaron stakeholders relevantes?
- ¿La participación fue apropiada?
- ¿Se resolvieron incidentes críticos escapados a producción?
- ¿Los defectos de alta prioridad fueron encontrados temprano?
- ¿Se pudieron explicar resultados en términos de riesgo?
- ¿Las pruebas omitidas tenían menor riesgo que las ejecutadas?

Describe cómo se realizará el testing para alcanzar los objetivos bajo determinadas circunstancias.

- **Relevant**

# 2.1 Test Metrics

## Objetivo

Las métricas permiten determinar si los test objectives están siendo alcanzados.

Cada métrica debe:

- definirse
- medirse
- monitorearse
- reportarse

---

# 2.1.1 Categorías de métricas

## Project Metrics

Miden el progreso respecto a criterios del proyecto.

Ejemplos:

- porcentaje ejecutado
- porcentaje passed
- porcentaje failed

## Product Metrics

Miden atributos del producto.

Ejemplos:

- calidad observada
- cobertura
- comportamiento del producto

## Process Metrics

Miden:

- capacidad del proceso
- efectividad
- eficiencia

---

# 2.1.2 Métricas de Monitoring / Control / Completion

Ejemplos mencionados:

| Métrica | Monitoring / Control | Completion |
|---|---|---|
| Requirements coverage | Sí | Sí |
| Product risk coverage | Sí | Sí |
| Code coverage | Sí | No |
| Actual vs planned estimation | Sí | No |
| Executed test cases by status | Sí | Sí |
| Resolved vs accumulated defects | Sí | No |
| Actual vs planned automated tests | No | Sí |
| Actual vs planned cost | No | Sí |

## Idea

Monitoring / Control se concentra principalmente en progreso.

Completion se concentra principalmente en cumplimiento de objetivos.

---

# 2.1.3 Test Reporting

Los reportes deben ayudar a stakeholders a tomar decisiones.

No basta con mostrar datos.

Hay que comunicar:

- progreso
- riesgos
- desviaciones
- defectos relevantes
- cumplimiento de objetivos
- exit criteria
- implicaciones

## Ejemplo

Reporte poco útil:

> 420 Passed, 18 Failed.

Reporte más útil:

> El 95% del alcance fue ejecutado. Permanecen 18 fallos; algunos afectan funcionalidades de riesgo alto y deben evaluarse antes del cierre.

---

# 2.2 Test Estimation

La estimación debe considerar todas las actividades necesarias para testing.

No solo ejecución.

---

# 2.2.1 Factores que influyen en el esfuerzo

Ejemplos:

- complejidad
- riesgos
- test basis
- calidad de requisitos
- skills
- experiencia
- automatización
- herramientas
- ambientes
- datos
- dependencias
- SDLC
- test levels
- test types
- restricciones de tiempo

---

# 2.2.2 Selección de técnica

Factores relevantes:

- complejidad
- disponibilidad de datos históricos
- disponibilidad de expertos
- conocimiento de modelos
- tiempo disponible
- SDLC

## Regla conceptual del syllabus

Si la complejidad es baja, pueden utilizarse técnicas basadas en métricas.

Si la complejidad es alta, pueden utilizarse técnicas basadas en expertos.

En un modelo secuencial puede ser apropiado Wideband Delphi.

En Agile puede ser apropiado Planning Poker.

---

# 2.2.3 Three-Point Estimation

Utiliza:

- Optimistic
- Most Likely
- Pessimistic

Permite calcular:

- expected value
- standard deviation

Su objetivo es representar incertidumbre.

---

# 2.2.4 Ratio-Based Estimation

Utiliza relaciones derivadas de información histórica.

Necesita datos anteriores confiables.

---

# 2.2.5 Extrapolation

Utiliza tendencias históricas para proyectar esfuerzo futuro.

También depende de datos históricos.

---

# 2.2.6 Wideband Delphi

Técnica basada en expertos.

Proceso general:

1. expertos estiman
2. se comparan resultados
3. se discuten diferencias
4. se revisan estimaciones
5. se busca convergencia

---

# 2.2.7 Planning Poker

Técnica basada en estimación del equipo.

Frecuente en Agile.

Proceso conceptual:

1. entender el trabajo
2. estimar individualmente
3. revelar estimaciones
4. discutir diferencias
5. volver a estimar

---

# 2.3 Defect Management

## Objetivo

Gestionar defectos permite:

- conocer el estado del producto
- monitorear calidad
- priorizar correcciones
- controlar trabajo
- obtener información para mejora

---

# 2.3.1 Defect Lifecycle

La detección temprana reduce el costo total de calidad.

## Static Testing

Busca defectos directamente en work products.

Ejemplos:

- requirements
- design
- code

## Dynamic Testing

El defecto puede manifestarse como un failure.

La diferencia entre actual y expected constituye una anomalía que debe investigarse.

## Idea importante

Un test fallido no necesariamente implica automáticamente un defecto del producto.

También puede existir:

- problema de automatización
- error de datos
- misunderstanding
- problema de ambiente

---

# 2.3.2 Cross-Functional Defect Management

Defect Management requiere:

- buena comunicación
- defect workflow
- herramientas
- roles claros
- coordinación entre stakeholders

La herramienta no sustituye la comunicación.

La reunión de defectos tampoco sustituye una buena herramienta.

Ambas cosas se complementan.

---

# 2.3.3 Defect Management en Agile

Puede ser menos formal.

No todos los defectos requieren necesariamente un reporte formal inmediato.

Sí se recomienda crear defect reports cuando:

- bloquean trabajo del sprint
- no pueden resolverse en la misma iteración
- requieren otros equipos
- requieren proveedores
- se necesita seguimiento formal

Los defectos no resueltos pueden añadirse al Product Backlog.

El nivel de formalidad depende de:

- co-location
- time zones
- cantidad de equipos
- madurez
- tamaño
- riesgos
- regulación
- contratos

---

# 2.3.4 Hybrid Defect Management

Retos comunes:

- diferentes herramientas
- diferentes workflows
- distinta cadencia
- distinta priorización
- falta de transparencia
- alineación de planes

Buenas prácticas:

- sincronizar herramientas
- acordar defect attributes
- involucrar Product Owners
- compartir planes
- coordinar prioridades

---

# 2.3.5 Defect Report Information

La información debe ser suficiente para:

- gestionar el lifecycle
- evaluar calidad
- evaluar progreso
- evaluar un increment
- analizar capacidad del proceso

## Información mínima importante

- defect title
- short summary
- detailed description
- steps to reproduce
- severity
- priority

## Información adicional habitual

- unique ID
- creation date/time
- reporter
- project
- SDLC phase
- current state
- owner
- change history
- references

## Principio

No agregar campos innecesarios.

Cada campo aumenta esfuerzo y puede generar confusión.

Recopilar únicamente información que tenga utilidad real.

---

# 2.3.6 Defect Data for Process Improvement

Los defectos pueden utilizarse para mejorar procesos.

Ejemplos:

- root cause → prevenir defectos similares
- defect location → detectar clusters
- reopened defects → evaluar calidad del debugging
- duplicate / rejected → evaluar calidad de reportes

No registrar defectos reduce la visibilidad y dificulta la mejora basada en datos.

# 3.6 Cost of Quality

El Cost of Quality agrupa los costos relacionados con calidad y defectos.

Existen cuatro categorías.

---

# 3.6.1 Defect Prevention Costs

Costos proactivos destinados a prevenir problemas.

Ejemplos:

- training
- reviews tempranos
- comunicación
- prácticas para mejorar calidad

---

# 3.6.2 Appraisal Costs

Costos asociados con detectar defectos.

Ejemplos:

- static testing
- dynamic testing
- reviews
- ejecución de pruebas

---

# 3.6.3 Internal Failure Costs

Costos reactivos antes de liberar el producto.

Ejemplos:

- corregir defectos
- re-testing
- workarounds internos
- retrabajo

---

# 3.6.4 External Failure Costs

Costos reactivos después de la entrega.

Ejemplos:

- pérdida de ingresos
- pérdida de activos
- impacto en salud o seguridad
- daño ambiental
- costos legales
- correcciones en producción
- despliegues correctivos

---

# 3.7 Cost-Benefit Relationship of Testing

El objetivo no es maximizar el testing sin límite.

El Test Manager debe ayudar a encontrar un equilibrio entre:

- costo de testing
- beneficio esperado
- riesgo
- costo de fallos

## Idea central

**Muy poco testing** puede producir baja calidad y altos costos de fallos.

**Demasiado testing** puede generar retrasos y costos mayores que el beneficio.

El objetivo es encontrar un nivel apropiado de testing.

# 4. Comparaciones clave

## Monitoring vs Control

| Monitoring | Control |
|---|---|
| Recopila información | Toma acciones |
| Mide progreso | Corrige desviaciones |
| Evalúa estado | Ajusta el plan |

---

## Product Risk vs Project Risk

| Product Risk | Project Risk |
|---|---|
| Afecta calidad del producto | Afecta ejecución del proyecto |
| Error funcional | Falta de recursos |
| Seguridad | Ambiente no disponible |
| Datos incorrectos | Retraso de proveedor |

---

## Test Strategy vs Test Approach

| Strategy | Approach |
|---|---|
| Dirección general | Implementación |
| Define cómo alcanzar objetivos | Define cómo ejecutar las tareas |

---

## Prevention vs Appraisal

| Prevention | Appraisal |
|---|---|
| Evitar defectos | Detectar defectos |
| Training | Testing |
| Reviews tempranos | Inspecciones |

---

## Internal vs External Failure

| Internal Failure | External Failure |
|---|---|
| Antes de entrega | Después de entrega |
| Defecto encontrado en QA | Defecto encontrado en producción |

---

## Heavyweight vs Lightweight RBT

| Heavyweight | Lightweight |
|---|---|
| Formal | Menos formal |
| Documentación detallada | Documentación reducida |
| Más stakeholders | Menos stakeholders |
| Mayor esfuerzo | Menor esfuerzo |
| Safety-critical | Frecuente en contextos menos críticos |

# 5. Flujos para mostrar visualmente

## Test Management

**Planning → Monitoring → Control → Completion**

## Risk Management

**Risk Identification → Risk Assessment → Risk Mitigation / Risk Monitoring**

## IDEAL

**Initiating → Diagnosing → Establishing → Acting → Learning**

## Defect Lifecycle conceptual

**Detect → Report → Analyze → Prioritize → Fix → Retest → Close**

# 6. Ejemplos prácticos

## Ejemplo 1 — Monitoring vs Control

Se planificaron 100 pruebas.

Estado:

- 60 ejecutadas
- 45 Passed
- 10 Failed
- 5 Blocked

Esto es **Monitoring**.

El Test Manager detecta que los 5 bloqueos se deben a un ambiente inestable y decide:

- escalar el incidente
- ejecutar primero las pruebas no dependientes
- reasignar temporalmente recursos

Esto es **Control**.

---

## Ejemplo 2 — Product Risk

Una API bancaria puede procesar dos veces una transferencia.

Likelihood: Media

Impact: Crítico

El riesgo debe recibir alta atención porque el impacto es significativo.

Acciones posibles:

- probar temprano
- aumentar cobertura
- ejecutar pruebas de concurrencia
- usar pruebas negativas
- automatizar regresión crítica

---

## Ejemplo 3 — Project Risk

El ambiente QA estará fuera de servicio durante dos días.

Esto afecta la ejecución del proyecto, no directamente la calidad del producto.

Es un **Project Risk**.

---

## Ejemplo 4 — Metrics

Reporte:

> 95% de pruebas Passed.

Por sí solo no basta.

Si el 5% fallido afecta funcionalidades de riesgo alto, el producto puede no estar listo.

Las métricas deben interpretarse junto con:

- riesgos
- severidad
- alcance
- cobertura
- exit criteria

---

## Ejemplo 5 — Defect Management

Durante una prueba se obtiene HTTP 500.

Antes de concluir que existe un defecto del producto deben descartarse causas como:

- datos incorrectos
- error de ambiente
- script de automatización
- misunderstanding del requisito

Después se crea el defect report si corresponde.

---

## Ejemplo 6 — Cost of Quality

### Prevention
Review temprano de requisitos.

### Appraisal
Ejecución de pruebas.

### Internal Failure
Bug encontrado y corregido en QA.

### External Failure
Bug encontrado por un cliente en producción.

# 7. Conceptos para repaso rápido

## Planning
Definir cómo alcanzar los objetivos de testing.

## Monitoring
Medir y observar el progreso.

## Control
Actuar ante desviaciones.

## Completion
Cerrar, archivar, comunicar y aprender.

## Risk-Based Testing
Priorizar testing según riesgo.

## Likelihood
Probabilidad de ocurrencia.

## Impact
Consecuencia si el riesgo ocurre.

## Test Strategy
Dirección general del testing.

## Test Approach
Forma concreta de implementar el testing.

## SMART
Método para definir objetivos medibles.

## IDEAL
Modelo de mejora continua.

## Metrics
Indicadores para evaluar progreso y objetivos.

## Test Estimation
Estimación del esfuerzo requerido para testing.

## Defect Management
Proceso para registrar, analizar, priorizar, corregir y cerrar anomalías o defectos.

## Professional Competence
Skills especializados.

## Methodological Competence
Capacidad analítica y conceptual.

## Social Competence
Capacidad de comunicación y colaboración.

## Personal Competence
Autogestión y desarrollo personal.

## Motivators
Factores que pueden generar satisfacción.

## Hygiene Factors
Factores cuya ausencia puede desmotivar.

## Prevention Cost
Costo de prevenir defectos.

## Appraisal Cost
Costo de detectar defectos.

## Internal Failure Cost
Costo de defectos antes de entrega.

## External Failure Cost
Costo de defectos después de entrega.

# 10. Mensaje final del resumen

Un Test Manager no se limita a coordinar ejecución.

Debe ser capaz de:

- entender el contexto
- identificar riesgos
- definir estrategia
- planificar
- medir
- controlar
- comunicar
- estimar
- gestionar defectos
- mejorar procesos
- seleccionar herramientas
- desarrollar al equipo
- demostrar el valor del testing

La idea central de este nivel es pasar de:

**“ejecutar pruebas”**
